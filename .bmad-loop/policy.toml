ISPATCH_MAX_IN_FLIGHT MASTRACODE_ALLOWED_ORIGINS " in *" $k "*) test "$n" = "1" || { echo "AD-7/NFR8 put $k at EXACTLY one literal process.env read site in first-party code; this tree has $n. These are the three keys Story 5.6 moved out of the entry with the factory call, and each has a named home: MASTRACODE_PUBLIC_URL in $c/public-url.ts, because its two consumers sit in different concerns, and the other two in $c/factory.ts, the only thing that takes them. Read sites (file:line:match):"; printf "%s\n" "$rd"; exit 1; }; case "$k" in MASTRACODE_PUBLIC_URL) hm=$c/public-url.ts; hw="its two consumers sit in different concerns, so the value belongs to neither of them";; *) hm=$c/factory.ts; hw="the factory call is the only thing that takes it";; esac; printf "%s\n" "$rd" | grep -q "^$hm:" || { echo "the one read of $k is not in $hm, which is the module AD-8 gives it: $hw. Counting the read anywhere under $c/ would leave the key owned by whichever module happened to take it, and a guard that names a home in its message without checking it asserts less than it claims. Read site (file:line:match):"; printf "%s\n" "$rd"; exit 1; };; *) test "$n" -le 1 || { echo "AD-7/NFR8 put every key declared in $s at AT MOST one literal process.env read site across src/, and $k has $n. Every consumer takes the parsed value by argument or module export; a second read is a second spelling of the same decision, and the two drift with nothing reporting it. The key set here is DERIVED from $s rather than written out in this guard, so a key added tomorrow is censused without anyone remembering this exists. These spellings count as a read — process.env.$k, process.env[quoted $k] in any of the three quote styles, process indexed by a quoted env and then $k, any of those reached through optional chaining, and a { $k } destructuring off process.env — and an assignment does not. An alias (const e = process.env) is not a literal read and is outside what AD-7 says here. A line that is WHOLLY a comment is not scanned. Read sites (file:line:match):"; printf "%s\n" "$rd"; exit 1; };; esac; done; exit 0' ''',
