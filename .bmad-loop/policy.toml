  '''sh -c 'd=$(command -v docker 2>/dev/null); test -n "$d" || { test -x /opt/homebrew/bin/docker && d=/opt/homebrew/bin/docker; }; test -n "$d" || { echo "no docker on PATH and none at /opt/homebrew/bin/docker, so the Compose project name and the data volume it prefixes are UNVERIFIED rather than satisfied. Put the engine on PATH: ops/factory-start.sh and both launchagent plists bake /opt/homebrew/bin in for the same reason"; exit 1; }; "$d" compose version >/dev/null 2>&1 || { echo "the docker at $d has no compose subcommand, so the Compose project name and the data volume it prefixes are UNVERIFIED rather than satisfied — the engine and the Compose CLI plugin are separate installs. Link the plugin in as step 1 of ops/README.md shows: mkdir -p ~/.docker/cli-plugins, then symlink docker-compose into it"; exit 1; }; c=docker-compose.yml; test -f "$c" || { echo "missing $c, or it is not a regular file — this guard reads the project name and volume set docker compose resolves from it"; exit 1; }; test -s "$c" || { echo "$c is empty, so it pins no project name at all"; exit 1; }; q=$(printf "\47"); dq=$(printf "\42"); grep -qxE "name:[[:space:]]*[$dq$q]?mastra-factory[$dq$q]?[[:space:]]*(#.*)?" "$c" || { echo "$c carries no column-0 name: mastra-factory line — single or double quoting around the value and a trailing # comment are all accepted, because Compose resolves every one of those to the same project. The resolved read below cannot stand in for this one: Compose falls back to the checkout directory basename, and the main checkout IS named mastra-factory, so there the resolved name comes out right with no name: key in the file at all and this invariant would hold only by accident of where the gate was run"; exit 1; }; test -f .env && cpn=$(grep -E "^[[:space:]]*COMPOSE_PROJECT_NAME[[:space:]]*=" .env | tail -1 | sed -E "s/^[[:space:]]*COMPOSE_PROJECT_NAME[[:space:]]*=[[:space:]]*//; s/[[:space:]]*$//; s/^[$dq$q]//; s/[$dq$q]$//") && test -n "$cpn" && test "$cpn" 