#      `node_modules` lands, and nothing else here would notice.
#      (c) `git -c core.quotePath=false ls-files` lists no `pnpm-workspace.yaml`,
#      `pnpm-workspace.yml`, `pnpm-lock.yaml`, `yarn.lock`, `bun.lockb`,
#      `bun.lock`, `npm-shrinkwrap.json`, `lerna.json`, `turbo.json`, `nx.json`
#      or `rush.json` at ANY depth, and no `package.json` BELOW the repository
#      root. The second-package-manager names alone were not enough for a guard
#      whose heading is the single-package shape: the strongest signal of a
#      second package is a second `package.json`, and `packages/foo/package.json`
#      needs no lockfile beside it to be one. Guard 20 already closes the
#      repository ROOT against everything the AD-3 allowlist does not name, so
#      (c) earns its keep only below the root — `packages/foo/pnpm-lock.yaml`
#      passes guard 20 and fails this one — and the two in-`package.json` keys
#      are invisible to it either way.
#      The cheaper form — assert `packageManager` is merely PRESENT — was
#      rejected because a pin nothing compares against is decoration: a scratch
#      package pinned to `npm@99.99.99-does-not-exist` installs cleanly, measured.
#      Comparing it to the npm actually running the gate has an admitted cost:
#      upgrading the host npm fails the gate on an unrelated story. That is the
#      intended signal, and the message says so — including the part an operator
#      has to act on, that this guard fails EVERY subsequent unattended run until
#      the pin is moved — because the fix, bump the pin and regenerate the
#      lockfile in one commit, is the same review moment guard 25's pinned digest
