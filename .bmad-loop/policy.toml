  '''sh -c 'for p in sandbox/factory-sandbox.Dockerfile sandbox/README.md ops/README.md ops/launchagents/ai.mastra.colima.plist ops/launchagents/ai.mastra.factory.plist ops/factory-start.sh ops/newsyslog/ai.mastra.factory.conf ops/install.sh apps/github/README.md apps/linear/README.md apps/slack/README.md apps/slack/manifest.yaml; do m=$(git ls-files -s -- "$p" | cut -d" " -f1); case "$m" in 100644|100755) ;; "") echo "seeded operational artifact missing or empty: $p — not tracked; the structural seed in ARCHITECTURE-SPINE.md names one real file at this path (AD-5)"; exit 1;; *) echo "seeded operational artifact missing or empty: $p — index mode $m is not a regular file (a symlink or gitlink, which a fresh worktree checks out as a link, not the artifact); the structural seed in ARCHITECTURE-SPINE.md names one real file at this path (AD-5)"; exit 1;; esac; s=$(git cat-file -s ":$p" 2>/dev/null); test -n "$s" && test "$s" -gt 0 || { echo "seeded operational artifact missing or empty: $p — its staged blob is 0 bytes; the structural seed in ARCHITECTURE-SPINE.md names one real file at this path (AD-5)"; exit 1; }; done' ''',
  '''sh -c 'b=$(printf "\140"); sp=$(ls _bmad-output/planning-artifacts/architecture/*/ARCHITECTURE-SPINE.md 2>/dev/null); c=$(printf "%s" "$sp" | grep -c "ARCHITECTURE-SPINE.md"); test "$c" = "1" || { echo "expected exactly one _bmad-output/planning-artifacts/architecture/*/ARCHITECTURE-SPINE.md to derive the AD-3 root sets from, found $c — the root closed set is normative in the spine, not here"; exit 1; }; s3=$(sed -n "/^### AD-3/,/^### AD-4/p" "$sp"); printf "%s\n" "$s3" | tail -1 | grep -q "^### AD-4" || { echo "the AD-3 section of $sp does not end at a ### AD-4 heading, so the extraction range of this guard ran past it and would read rows from later sections — fix the spine headings"; exit 1; }; db=$(sed -n "/[*][*]Root directories — closed set/,/[*][*]Root allowlist — closed set/p" "$sp"); printf "%s\n" "$db" | tail -1 | grep -q "[*][*]Root allowlist — closed set" || { echo "the AD-3 root directory closed-set bullet of $sp is not followed by its root allowlist bullet, so the extraction range of this guard ran to end of file and would silently WIDEN the closed set with every backticked path elsewhere in the spine — fix the spine bullets"; exit 1; }; af=$(printf "%s\n" "$s3" | grep -oE "^[[:space:]]*[|] $b[^$b]+$b [|]" | sed "s/^[[:space:]]*[|] $b//; s/$b [|]\$//"); ad=$(printf "%s\n" "$db" | grep -oE "$b[A-Za-z_.][A-Za-z0-9_.-]*/$b" | tr -d "$b" | sed "s|/\$||" | sort -u); printf "%s\n" "$af" | grep -qxF "package.json" || { echo "could not extract the AD-3 root allowlist table from $sp (no package.json row) — this guard derives root from the spine, so fix the AD-3 table"; exit 1; }; printf "%s\n" "$ad" | grep -qxF "src" || { echo "could not extract the AD-3 root directory closed set from $sp (no src/ entry) — this guard derives root from the spine, so fix the AD-3 closed-set bullet"; exit 1; }; tf=$(git -c core.quotePath=false ls-files | grep -v "/"); wt=$(git -c core.quotePath=false ls-files; git -c core.quotePath=false ls-files -o --exclude-standard); rf=$(p