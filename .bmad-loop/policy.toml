#      measured), and only then are the keys judged. The `try`/`catch` is kept
#      behind all three as a backstop against empty stdin, not as the cover for
#      any of them. Once the keys ARE judged, absent and masked are two failures
#      and not one: a key missing from the resolved config has lost its
#      DECLARATION, and telling the operator to restore a `# @public` line above
#      a declaration that is not there sends them to the wrong edit. The two
#      branches print different messages for that reason.
#      Verified both ways: passes as committed (measured: varlock reports
#      `isSensitive:false` for both with no `.env` present); fails naming the key
#      when the `# @public` line above `POSTGRES_USER` is removed and when the
