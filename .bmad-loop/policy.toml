# bmad-loop orchestration policy. All keys optional; defaults shown.

[gates]
mode = "per-epic"            # none | per-epic | per-story-spec-approval
retrospective = "notify"     # never | notify | auto (auto unsupported in v1)

[limits]
max_review_cycles = 3
max_dev_attempts = 2
artifact_file_max_mb = 5    # raw-byte cap for each ignored artifact selected for publication
artifact_payload_max_mb = 10 # raw-byte cap across all selected ignored publication artifacts
max_followup_reviews = 1     # additional review rounds granted solely because a finalized (status: done) round still recommended a follow-up; once spent, such a round converges + refiles the recommendation instead of burning another cycle. 0 = never honor a pass's own recommendation
session_timeout_min = 90
git_timeout_s = 120          # bound on any single git subprocess; exceeding it pauses/degrades (never crashes the run) — raise on a loaded host or a very large worktree
teardown_grace_s = 20        # verified teardown: poll a killed session window up to this long, then force-kill its pane pids and re-kill (#157). 0 = single unverified best-effort kill
stop_without_result_nudges = 1
dev_stall_grace_s = 600      # silence grace armed at dev/review launch and re-armed by transport activity or fresh Stop/idle evidence before bounded recovery. 0 = no launch timer, but a result-less turn end still fails fast
dev_stall_nudges = 2         # best-effort wake nudges per silent grace before stalling; fresh Stop/idle evidence restores this budget. 0 = stall on grace expiry
dev_stall_nudges_cap = 6     # total (never-restored) nudge bound per dev/review session; bounds launch-time recovery and Stop/idle budget refills because an accepted nudge does not guarantee a wake. 0 = stall on first grace expiry
workflow_stall_nudges_cap = 3 # total (never-restored) stall nudges for an injected plugin-workflow session before it is called stalled; bounds a session that finished its work but never wrote its completion marker. 0 = stall on first grace expiry
dev_contract_nudge = true    # true: one targeted nudge per session (#276) when a Stop finds a spec finalized to a terminal frontmatter status but missing its `## Auto Run Result` marker, asking the skill to append it and end its turn; sent exactly once, never refilled, touches no stall counters. false: rely only on harness-side frontmatter synthesis
max_tokens_per_story = 1000000   # lowered from 2M: these stories are small, config-shaped edits
cache_read_weight = 0.1      # cache reads bill at ~0.1x input on all vendors; 1.0 = count raw
session_budget_mode = "warn"  # off | warn | enforce — weighted per-SESSION cap sampled every ~30s mid-session; warn = one ATTENTION + breadcrumb; enforce = wrap-up nudge (best-effort courtesy; the kill is the guarantee) then over_budget termination (retry→defer). Live-verified on claude; other transcript parsers sample best-effort (mid-turn flush unverified); inert where no mid-session usage signal exists (usage_parser "none", copilot's shutdown-only flush)
max_tokens_per_session = 4000000 # weighted cap a single session may spend before the guard trips; healthy sessions run ~1-2.5M weighted, so the default trips only true runaways (#158)
session_budget_grace_s = 240 # enforce mode: seconds a tripped session gets to wrap up after the nudge before over_budget termination. 0 = terminate at trip, no nudge

[verify]
# Deterministic gates run by the orchestrator after a clean review, before commit.
# `npm ci` first: worktree isolation checks out tracked files only, so a fresh
# story worktree has no node_modules and `tsc` would fail for the wrong reason.
#
# The two guards after the typecheck enforce AD-4 and AD-9/AD-13, which prose in
# AGENTS.md can only ask for:
#   1. No first-party .ts/.js/.mjs/.cjs outside src/. tsconfig.json is
#      include: ["src/**/*"], so `tsc --noEmit` never sees such a file and it
#      ships unverified. Prints the offending paths and fails.
#   2. .agents/skills/ is untouched. Its content is hash-locked in
#      skills-lock.json by the Mastra CLI; that hash is not reproducible from
#      the files with shasum, so this asserts the tree is unmodified instead.
#      Catches uncommitted edits, which is where verify runs (after review,
#      before commit) — a session that committed the edit first would slip past.
#
# `npm test` is APPENDED, never substituted for the list: the two guards above
# are enforced nowhere else, so rewriting this array would silently delete them.
# It runs `vitest run --dir src` — vitest on its defaults (AD-3: no
# vitest.config.ts at root), scoped to src/. The scope matches guard 1 above,
# which admits first-party TypeScript anywhere under src/: scoping any narrower
# would let a test outside that subtree typecheck, pass both guards and never
# run, with the gate still reporting green. What --dir is actually for is
# keeping the scan from descending into the worktree copies under
# .bmad-loop/runs/, which vitest's defaults DO collect (they are gitignored, but
# vitest does not read .gitignore).
#
# `varlock load` resolves .env.schema, which nothing else in the gate opens:
# `tsc` is include: ["src/**/*"], vitest runs --dir src and its preamble deletes
# every variable the entry reads, and neither guard below looks at a non-.ts
# file. So an unresolvable schema — an unbalanced quote in a decorator, a key
# wrongly marked required — ships green and first appears as a crash-looping
# launchd job, because `npm start` is `varlock run -- mastra start`. It resolves
# the schema alone here: .env is gitignored and absent from a story worktree.
#
# That absence is also the constraint this command imposes: with no .env every
# value is empty, so an UNCONDITIONAL `@required` anywhere in .env.schema fails
# this gate in every story worktree, whether or not the declaration is right.
# Every @required in the schema today is conditional (`@required=not(isEmpty(
# $OTHER_KEY))`) and stays false while its dependency is empty, which is why the
# gate is green. A key that genuinely must be supplied in production is declared
# the same conditional way, or documented as required in prose — never as a bare
# `@required`, which this gate cannot distinguish from the mistake above.
#
# The `json-full` guard covers what `json` cannot see: sensitivity. The header of
# .env.schema is `@defaultSensitive=true`, so a key that loses its `# @public`
# line is masked in the stdout of `varlock run -- mastra start` — the deployment's
# only diagnostic surface, and the one ops/README.md teaches the operator to read
# for a wrong bind address. `--format json` emits resolved values only and carries
# no sensitivity field, and unset keys do not appear in it at all, so dropping the
# annotation exits 0 through every other command here. Verified both ways in a
# story worktree: the guard passes as written and fails naming the key when a
# `# @public` line is removed.
#
# The last eleven guards cover ops/, which nothing else here opens: `tsc` is
# include: ["src/**/*"], vitest runs --dir src, and the AD-4 path guard filters
# *.ts/*.js/*.mjs/*.cjs, so a plist, a shell script and a newsyslog conf are all
# invisible to every command above. They are launchd's own inputs, so a mistake
# in one surfaces as a crash-looping or silently-misconfigured agent rather than
# as a failed build:
#   1. `plutil -lint` on both plists — launchd refuses a malformed property list
#      and reports it only in its own log.
#   2. `zsh -n` on both ops/*.sh — a syntax error in the wrapper is a job that
#      never starts, and in the installer a partial placement.
#   3. Both ops/*.sh are mode 100755 in the index. launchd execs the wrapper by
#      path and `ops/install.sh` refuses to link a non-executable one; a lost
#      +x is invisible in a diff. Counts the 100755 rows and requires exactly 2,
#      so a wrong mode and a missing file both fail while the correct tree passes.
#   4. The one baked repo root agrees across all three files that hard-code it.
#      Every path in the plists is absolute (launchd never expands $HOME), so a
#      moved repo has to be rewritten in three places at once. Reads
#      EXPECTED_ROOT out of ops/install.sh and requires the factory plist's
#      WorkingDirectory, its ProgramArguments wrapper path and the wrapper's own
#      REPO_ROOT to match it. Verified both ways in this worktree: passes as
#      written, fails when any one of the four is pointed elsewhere. Both `sed`
#      reads strip quotes, so quoting either literal — which the surrounding
#      style invites — does not fail the gate with a misleading message.
#   5. Each plist's Label equals its filename stem, it carries no UserName key,
#      and no value in it contains a literal $HOME. plutil -lint above proves
#      well-formedness only, and all three are things launchd acts on silently:
#      a job registers under its Label, so a label-addressed `launchctl
#      kickstart` misses a job that is loaded and running; UserName is the
#      daemon spelling this deployment must not use (agents, not daemons); and
#      launchd never expands $HOME, so such a path is simply never created.
#   6. The rotation conf parses: every non-comment row is one of exactly four,
#      on the specified terms `koval:staff 644 7 10240 * NJ`. Guards 1-4 never
#      open this file — it could be deleted outright and the gate stayed green —
#      and its failure mode is silence, since an unrotated log just grows.
#   7. The log paths agree between the conf and the plists, and sit under the
#      EXPECTED_HOME that ops/install.sh creates. This is the drift these files
#      exist to eliminate and the one docs/Self-hosting research.md §7 actually
#      has: a conf row naming a file no plist writes rotates nothing, and a
#      plist log path outside the directory the installer creates is an agent
#      that will not spawn. Guard 4 reconciles the repo root only.
#      Together, 4 and 7 are AD-11's "update the plist, the wrapper and the conf
#      in the same change" made mechanical.
#   8. The rotated log paths agree between the conf and the ONE paragraph of
#      ops/README.md that claims to list them: supervision checkpoint 4, which
#      tells the operator a `sudo newsyslog -nvv` dry run prints all four by
#      name. Guard 7 reconciles the conf against the plists; nothing here reads
#      the prose, and the prose is what the operator actually runs, so a fifth
#      row added to the conf or a renamed one leaves the README teaching the
#      wrong expected list and the right one as a fault.
#      docs/Self-hosting research.md §7.4 is the live proof that a conf and its
#      narrative drift apart in silence: it still carries the superseded
#      three-row version. Scoped and compared deliberately: the README side is
#      the `### 4 — rotation is in force` section only (sliced to the next
#      `### 5 `), so prose elsewhere — a rotated-generation glob in checkpoint 3,
#      a bare `out.log` in a sentence — is neither a claim nor a false failure;
#      and both sides are compared as whole absolute paths rather than bare
#      basenames or a shared tail, so a home or directory rewritten on either
#      side alone is caught too — a tail-only comparison passed a checkpoint 4
#      that named /Users/bob, which is the drift this guard exists for.
#      Verified both ways in this worktree: passes as written, and fails naming
#      ops/README.md when a conf row is dropped, when a fabricated path is added
#      to checkpoint 4, when one of checkpoint 4's four expected paths is
#      deleted, and when the home is rewritten on either side alone; a novel log
#      path written outside the sliced section still passes, and a deleted
#      ops/README.md or conf is reported as missing rather than as disagreement.
#   9. Every launchd job name ops/README.md addresses is one the plists
#      actually declare, read two ways: the `gui/$(id -u)/<name>` service
#      targets against each plist's Label, and the
#      `~/Library/LaunchAgents/<name>.plist` paths the bootstrap and teardown
#      commands name against the plist filenames. Guard 5 pins each Label to
#      its filename stem; nothing pins the prose, and the prose is what the
#      operator types. A renamed job silently orphans every `launchctl
#      kickstart`, `bootout` and `print` command in that document — the
#      recovery proofs are built out of them — and launchctl reports an unknown
#      job name as a bare `No such process` and nothing else; the reverse,
#      prose naming a job no plist declares, reads identically. Two extraction
#      details. The service-target class [A-Za-z0-9_.-] admits a trailing `.`,
#      so an un-backticked job name ending a sentence would be read as
#      `ai.mastra.factory.` and fail a correct document; trailing `.` and `-`
#      are stripped before the comparison. And the filename side requires the
#      capitalised `LaunchAgents/` directory, so the lowercase
#      `ops/launchagents/` references in the same prose are not swept in. The
#      literal `<label>` placeholder in supervision checkpoint 1 and the bare
#      `gui/$(id -u)` of the four `bootstrap` calls both match nothing.
#      Verified both ways in this worktree: passes as written, and with a
#      sentence-ending `gui/$(id -u)/ai.mastra.factory.` added; fails naming
#      both sides when a plist Label is rewritten, when a fabricated
#      gui/$(id -u)/ai.mastra.nope is added, and when a
#      LaunchAgents/<name>.plist the prose bootstraps is renamed.
#  10. The `[factory] …` lines ops/README.md greps out.log for are printed
#      verbatim by ops/factory-start.sh. Recovery proof 3's entire result is
#      two such greps and supervision checkpoint 3 carries a third, and nothing
#      else in this gate compares the two files: a reworded `print` in the
#      wrapper leaves every one of those greps matching nothing — a guaranteed
#      false failure for the operator — while all fifteen commands above stay
#      green. Scoped to the grep arguments (`grep -F '[factory]…'`, which also
#      catches the `bzgrep` form), not to every [factory] string in the file,
#      so a full line quoted inside a sentence stays narrative rather than
#      becoming a claim. Verified both ways in this worktree: passes as
#      written; fails naming the text when ops/factory-start.sh:72's "waiting
#      up to" or :107's "docker socket is up" is reworded, and when the README
#      greps for a line the wrapper never prints.
#  11. The forced rotation in recovery proof 4 names a log the conf actually
#      rotates. `sudo newsyslog -F <path>` is the one command in this document
#      that trims a real log; its path argument is what keeps the run off every
#      other conf in /etc/newsyslog.d/, and it sits one heading below guard 8's
#      slice, so nothing read it — the deployment home could be moved in the
#      conf, both plists and ops/install.sh while that one line stayed on
#      /Users/koval, with guards 4, 5, 7, 8 and 9 all passing. Only the last
#      field of a `newsyslog -F …` command is extracted, rather than widening
#      guard 8's path regex over the whole file, which would sweep in
#      out.log.0.bz2 and checkpoint 3's bzgrep glob and fail on correct prose.
#      Verified both ways in this worktree: passes as written; fails naming the
#      path when the home is rewritten in that argument alone, when the conf
#      row it names is renamed, and when the path argument is dropped from the
#      command altogether — which is the bare `-F` form that would trim every
#      log on the host.
commands = [
  "npm ci --no-audit --no-fund",
  "npm run check",
  "npx varlock load --format json",
  '''sh -c 'npx varlock load --format json-full | node -e "let s=\"\";process.stdin.on(\"data\",d=>s+=d).on(\"end\",()=>{const c=JSON.parse(s).config||{};for(const k of [\"MASTRA_HOST\",\"PORT\",\"DOCKER_HOST\"]){if(!c[k]||c[k].isSensitive!==false){console.error(\"env key not marked @public in .env.schema: \"+k);process.exit(1)}}})"' ''',
  '''sh -c 'git ls-files "*.ts" "*.js" "*.mjs" "*.cjs" | grep -v "^src/" && exit 1 || exit 0' ''',
  '''sh -c 'git status --porcelain -- .agents/skills | grep . && exit 1 || exit 0' ''',
  "npm test",
  '''sh -c 'plutil -lint ops/launchagents/*.plist' ''',
  '''sh -c 'for f in ops/*.sh; do zsh -n "$f" || exit 1; done' ''',
  '''sh -c 'git ls-files -s ops/factory-start.sh ops/install.sh | grep -c "^100755 " | grep -qx 2 || { echo "ops/*.sh must be mode 100755 in the index"; exit 1; }' ''',
  '''sh -c 'r=$(sed -n "s/^readonly EXPECTED_ROOT=//p" ops/install.sh | tr -d "\""); p=ops/launchagents/ai.mastra.factory.plist; test -n "$r" && test "$(plutil -extract WorkingDirectory raw $p)" = "$r" && test "$(plutil -extract ProgramArguments.2 raw $p)" = "$r/ops/factory-start.sh" && test "$(sed -n "s/^readonly REPO_ROOT=//p" ops/factory-start.sh | tr -d "\"")" = "$r" || { echo "baked repo root disagrees across ops/install.sh, $p and ops/factory-start.sh"; exit 1; }' ''',
  '''sh -c 'for p in ops/launchagents/*.plist; do b=$(basename "$p" .plist); l=$(plutil -extract Label raw "$p") || exit 1; test "$l" = "$b" || { echo "$p: Label $l does not match filename stem $b — launchd registers the job under its Label"; exit 1; }; if plutil -extract UserName raw "$p" >/dev/null 2>&1; then echo "$p: carries UserName — these are agents, not daemons"; exit 1; fi; if grep -q "[$]HOME" "$p"; then echo "$p: contains a literal \$HOME, which launchd never expands"; exit 1; fi; done' ''',
  '''sh -c 'c=ops/newsyslog/ai.mastra.factory.conf; test -f "$c" || { echo "missing $c"; exit 1; }; d=$(grep -cvE "^[[:space:]]*(#.*)?$" "$c"); n=$(grep -cE "^[^[:space:]]+[[:space:]]+koval:staff[[:space:]]+644[[:space:]]+7[[:space:]]+10240[[:space:]]+\*[[:space:]]+NJ$" "$c"); test "$d" = "4" && test "$n" = "4" || { echo "$c: expected 4 rotation rows on koval:staff 644 7 10240 * NJ — found $d data rows, $n well-formed"; exit 1; }' ''',
  '''sh -c 'h=$(sed -n "s/^readonly EXPECTED_HOME=//p" ops/install.sh | tr -d "\""); test -n "$h" || { echo "no EXPECTED_HOME in ops/install.sh"; exit 1; }; d="$h/Library/Logs/mastra-factory"; pl=$(for p in ops/launchagents/*.plist; do plutil -extract StandardOutPath raw "$p" || exit 1; plutil -extract StandardErrorPath raw "$p" || exit 1; done | sort); cf=$(grep -vE "^[[:space:]]*(#.*)?$" ops/newsyslog/ai.mastra.factory.conf | awk "{print \$1}" | sort); test "$pl" = "$cf" || { echo "rotation conf log paths differ from the plists StandardOutPath/StandardErrorPath"; exit 1; }; echo "$pl" | grep -qvE "^$d/[^/]+$" && { echo "a log path is not directly under $d, which ops/install.sh is what creates"; exit 1; }; exit 0' ''',
  '''sh -c 'c=ops/newsyslog/ai.mastra.factory.conf; d=ops/README.md; for f in "$c" "$d"; do test -f "$f" || { echo "missing $f"; exit 1; }; done; e="/[A-Za-z0-9_./-]*mastra-factory/[A-Za-z0-9_.-]+\.log"; cf=$(grep -vE "^[[:space:]]*(#.*)?$" "$c" | awk "{print \$1}" | grep -oE "$e" | sort -u); rd=$(sed -n "/^### 4 — rotation is in force$/,/^### 5 /p" "$d" | grep -oE "$e" | sort -u); test -n "$rd" || { echo "$d: supervision checkpoint 4 names no $e path, so it asserts nothing about $c"; exit 1; }; test "$cf" = "$rd" || { echo "$d supervision checkpoint 4 and $c disagree on the rotated log paths: conf has [$(echo $cf)], checkpoint 4 has [$(echo $rd)]"; exit 1; }' ''',
  '''sh -c 'd=ops/README.md; test -f "$d" || { echo "missing $d"; exit 1; }; pl=$(for p in ops/launchagents/*.plist; do plutil -extract Label raw "$p" || exit 1; done | sort -u); rd=$(grep -oE "gui/[$]\(id -u\)/[A-Za-z0-9_.-]+" "$d" | sed "s|.*/||; s|[.-]*$||" | sort -u); fn=$(grep -oE "LaunchAgents/[A-Za-z0-9_.-]+[.]plist" "$d" | sed "s|.*/||; s|[.]plist$||" | sort -u); test -n "$rd" || { echo "$d addresses no gui/\$(id -u)/<job> name, so it asserts nothing about the plist Labels"; exit 1; }; test "$pl" = "$rd" || { echo "$d and ops/launchagents/*.plist disagree on the launchd job names: plists declare [$(echo $pl)], $d addresses [$(echo $rd)]"; exit 1; }; test -n "$fn" || { echo "$d names no ~/Library/LaunchAgents/<name>.plist, so it asserts nothing about the plist filenames"; exit 1; }; test "$pl" = "$fn" || { echo "$d and ops/launchagents/*.plist disagree on the plist filenames: plists are [$(echo $pl)].plist, $d bootstraps [$(echo $fn)].plist"; exit 1; }' ''',
  '''sh -c 'd=ops/README.md; s=ops/factory-start.sh; for f in "$d" "$s"; do test -f "$f" || { echo "missing $f"; exit 1; }; done; q=$(printf "\47"); l=$(grep -oE "grep -F $q\[factory\][^$q]*" "$d" | sed "s/^.*-F $q//" | sort -u); test -n "$l" || { echo "$d greps for no [factory] line, so it asserts nothing about $s"; exit 1; }; m=$(echo "$l" | while IFS= read -r x; do grep -Fq -e "$x" "$s" || echo "$x"; done); test -z "$m" || { echo "$d greps out.log for [factory] text $s does not print: $m"; exit 1; }' ''',
  '''sh -c 'd=ops/README.md; c=ops/newsyslog/ai.mastra.factory.conf; for f in "$d" "$c"; do test -f "$f" || { echo "missing $f"; exit 1; }; done; a=$(grep -oE "newsyslog -F[^|;]*" "$d" | awk "{print \$NF}" | sort -u); test -n "$a" || { echo "$d forces no newsyslog -F run, so it asserts nothing about $c"; exit 1; }; cf=$(grep -vE "^[[:space:]]*(#.*)?$" "$c" | awk "{print \$1}" | sort -u); m=$(echo "$a" | while IFS= read -r x; do echo "$cf" | grep -qxF -e "$x" || echo "$x"; done); test -z "$m" || { echo "$d forces newsyslog -F on a path that is no row of $c: $m"; exit 1; }' ''',
]
stream_capture_kb = 256      # per-stream cap (KiB) on the verifier stdout/stderr retained under the run's verify/ directory; the TAIL is kept and the journal records the full byte count plus a truncation flag. 0 = capture nothing (records still land, with null pointers)

[notify]
desktop = true               # notify-send (Linux) / osascript (macOS) / PowerShell toast (Windows), best-effort
file = true                  # ATTENTION file in the run dir

[review]
# enabled = true  -> run a follow-up review session (the dev primitive re-invoked
#                    on the done spec for a fresh review pass) after a dev pass.
# enabled = false -> skip that session; the dev pass's own inline review
#                    is the only review and it finalizes the story straight to done.
enabled = true
# trigger (only consulted when enabled = true) decides WHEN that session runs:
#   "recommended" -> only when the dev pass flags the story with
#                    `followup_review_recommended: true` (it self-reviews inline
#                    and flags this when its changes warrant an independent pass).
#   "always"      -> run the second-opinion review on every story.
# The loop is bounded by limits.max_review_cycles (hard cap) and damped by
# limits.max_followup_reviews (a round that finalizes the story yet keeps
# recommending a follow-up converges + refiles once the grant is spent) either way.
trigger = "recommended"
# What a timeout-like review verdict (timeout/stalled/over_budget) costs:
#   "retry"           -> burn a review cycle per timeout until max_review_cycles (default).
#   "salvage-if-done" -> if the dev product is already finalized and verify passes,
#                        commit it and refile the outstanding follow-up to deferred work.
#   "defer"           -> give up on the first timeout-like verdict.
on_timeout = "retry"
# What a review that writes sprint-status back off `done` (the sign-off the
# orchestrator recorded at dev time) costs. Nothing in the review loop
# re-advances the board, so every remaining cycle re-reads the same failure:
#   "escalate" -> pause the run naming both sides of the disagreement (default).
#   "retry"    -> legacy: burn review cycles to max_review_cycles, then defer.
on_status_contradiction = "escalate"

[stories]
# Story-queue source. "sprint-status" (default) walks sprint-status.yaml written
# by bmad-sprint-planning. "stories" opts into folder+id dispatch: the loop reads
# a typed stories.yaml (Story Breakdown output, sibling of SPEC.md) and dispatches
# each entry by spec-folder + story id. `bmad-loop run --spec <folder>` forces
# stories mode for a single run regardless of this setting.
source = "sprint-status"     # sprint-status | stories
# Required (and must parse) when source = "stories": the project-relative path to
# the epic's spec folder holding stories.yaml + SPEC.md. Ignored under sprint-status.
spec_folder = ""

[adapter]
name = "claude"              # claude | codex | gemini | copilot | antigravity | opencode-http (alias: opencode) | <custom .bmad-loop/profiles/*.toml>
model = ""                   # empty = CLI default model (opencode-http wants "provider/model")
cleanup_session_on_finish = true  # kill the run's tmux session when it finishes (false keeps it for inspection)
# extra_args replaces the profile's default permission-bypass flags when set:
# extra_args = ["--permission-mode", "bypassPermissions"]
# Optional overrides of the CLI profile's own defaults (unset = inherit the
# profile's shipped value; copilot ships usage_grace_s = 8 and
# stop_without_result_nudges = 5):
# usage_grace_s = 8.0                # seconds to poll the transcript for token usage after a session ends
# stop_without_result_nudges = 5     # result-less Stop signals tolerated before a session is called stalled

# Per-stage overrides for the dev, review and sweep-triage passes. Unset keys
# inherit from [adapter] when the stage runs the same client; a stage that
# switches client falls back to that profile's defaults instead (model and
# extra_args are client-specific). Stage tables must come after the [adapter]
# keys above.
# [adapter.dev]
# model = "opus"
# [adapter.review]
# name = "codex"
# model = "gpt-5-codex"
# stop_without_result_nudges = 5     # e.g. a multi-turn review needs more nudges than dev
# [adapter.triage]
# model = "opus"

[sweep]
# Deferred-work sweep: triage + execute open deferred-work.md entries.
auto = "never"               # never | per-epic | run-end (auto-triggered sweeps never prompt)
max_bundles = 5              # bundles executed per sweep; triage excess is truncated
max_triage_attempts = 2      # triage validation retries before escalating
max_migration_attempts = 2   # legacy-ledger migration retries before escalating
repeat = false               # after a cycle completes, re-triage and continue on newly deferred work
max_cycles = 5               # safety cap on total cycles per sweep run when repeat = true

[cleanup]
# Disk reclamation for .bmad-loop/runs. Only terminal (finished/stopped) runs are
# ever touched; paused/interrupted runs stay intact so they remain resumable.
# `bmad-loop clean` applies these, and every run/sweep start reconciles worktrees
# leaked by a mid-flight stop.
run_retention = 10           # newest concluded runs kept whole; older ones are trimmed/archived (0 keeps none)
retention_days = 0           # 0 = disabled; else also keep runs newer than N days regardless of count
trim_artifacts = true        # drop the heavy worktrees/ tree from concluded runs (run stays viewable in the TUI)
archive_old = true           # archive (.bmad-loop/archive/<id>.tar.gz) rather than hard-delete runs past the window
auto_clean_on_finish = true  # reconcile stale worktrees + apply retention when a run finishes cleanly
clean_tmp = true             # let engine plugins clean their /tmp scratch on finish (e.g. Unity MCP server zips)

[scm]
# Source-control isolation + merge-back. Defaults reproduce today's behavior:
# work happens in place on the checked-out branch, with no branches.
isolation = "worktree"       # none | worktree
branch_per = "story"         # story | run (worktree mode only; "run" forces delete_branch = false)
target_branch = "main"       # pinned explicitly: story branches merge into main. "" = the branch checked out at run start
merge_strategy = "ff"        # ff | merge | squash (worktree mode merges the unit branch into target locally)
delete_branch = true         # delete the unit branch after a successful merge
keep_failed = true           # keep a failed unit's worktree+branch for inspection
rollback_on_failure = false  # in-place (isolation="none") recovery after a failed attempt. false = never touch the tree; pause with manual recovery steps. true = auto-revert the attempt's tracked changes + remove only the untracked files this run created (WARNING: discards the attempt's uncommitted work; never a blanket git clean). Governs unattended/stopped attempts only: a resolved escalation's re-drive always auto-recovers regardless (reverts the failed source, keeps the corrected spec). Prefer isolation="worktree" to avoid touching your main checkout.
preserve_keep = 20           # attempt-preserve/* branches and attempt-preserve-dirty/* snapshots kept at run start (per family), newest by committer date; the tail is deleted (0 = never prune)
failed_diff_max_mb = 5       # per-file size cap (MB) for untracked files in a kept-failed unit's changes.patch; oversized files are skipped with a marker
failed_diff_unlimited = false # true = capture the failed-unit diff with no size cap (may produce very large patches; warns when active)
# commit_message_template: when set, the commit message dev sessions use for a
# story's commit. {story_key}, {run_id} and {story_title} (the spec's `title:`
# frontmatter, else a first `#` heading, minus any "Story <id>:" label; falls back to the
# key) are substituted.
# Empty = built-in default.
commit_message_template = ""
max_parallel = 1             # units in flight at once (parallel fan-out unbuilt; values > 1 clamp to 1)
# A git worktree checks out tracked files only, so gitignored MCP/CLI configs are
# absent from every fresh worktree and isolated sessions can't reach their MCP
# server. seed_adapter_defaults copies each loaded adapter's own config files
# (claude -> .mcp.json/.claude/settings.json, codex -> .codex/config.toml, etc.)
# into the worktree; worktree_seed adds extra project-specific gitignored paths.
seed_adapter_defaults = true # seed each loaded adapter's default gitignored configs into worktrees
worktree_seed = []           # extra gitignored files to copy into each worktree, on top of adapter defaults

[plugins]
# Plugin trust allowlist. A plugin dropped under .bmad-loop/plugins/<name>/ loads
# its declarative manifest (settings + out-of-process shell hooks) automatically.
# A plugin that ships an in-process [python] module is NEVER imported or run
# unless its name is listed here. Empty = no plugins trusted (today's behavior).
enabled = []                 # e.g. ["unity", "my-lint-plugin"]

# The game-engine layer is a plugin. For a Unity project whose dev/sweep cycle
# drives a live Editor via an Editor MCP, enable it above and configure it here:
#   [plugins.unity]
#   editor_mode = "shared"       # shared (live Editor; requires scm.isolation = "none")
#                                # | per_worktree (one Editor per worktree; requires
#                                #   scm.isolation = "worktree")
#   mcp = "ivanmurzak"           # which Editor MCP the scripts target: ivanmurzak | coplaydev
#   unity_path = ""              # Editor binary for a per_worktree launch ("" = auto-detect)
#   ready_timeout_sec = 600      # how long the readiness gate waits for the Editor + MCP
#   ready_grace_sec = -1         # delay before the first probe (-1 = auto: per_worktree waits)
# (The legacy [engine] block still loads with a deprecation warning, folded into
#  [plugins.unity] — migrate to [plugins] when convenient.)

[tui]
# low_frame_rate = true caps Textual to 15fps and disables animations (sets
# TEXTUAL_FPS=15 / TEXTUAL_ANIMATIONS=none at launch). Fixes repaint tearing
# over slow/high-latency links (SSH, Tailscale). Equivalent to launching with
# `bmad-loop tui --low-frame-rate`. Takes effect the next time the TUI starts.
low_frame_rate = false
# Persisted dashboard pane sizes, in terminal cells. 0 = unset (use the built-in
# default proportions). The TUI writes these when you resize a pane by mouse-drag
# or the Ctrl+W resize mode; they are re-applied on the next launch. Usually you
# won't hand-edit these — resize in the TUI instead.
# left_width = 0        # sidebar width, columns
# runs_height = 0       # Runs pane height, rows
# deferred_height = 0   # Deferred pane height, rows
# tasks_height = 0      # Tasks table height, rows
left_width = 64
tasks_height = 14

[operator]
# Let a dev session park a story at `awaiting-operator`: its agent-doable work is
# finished and COMMITTED, but its acceptance criteria include external actions
# only a human can perform (buy a domain, publish a DNS record, grant an API
# key). The story commits, the run moves on to the next one, and what is owed is
# recorded in the story spec's `operator_actions:` frontmatter. Complete such a
# story with `bmad-loop confirm <story-key>` once you have done those actions.
# Turn this off to hold sessions to the two older outcomes (done / blocked).
enabled = true

[mux]
# Terminal-multiplexer backend for this machine (the transport axis — which
# tmux-like program hosts sessions; independent of [adapter], the coding-CLI
# axis). Machine-specific: `bmad-loop init` gitignores policy.toml, so this
# choice never travels to teammates on other machines or OSes.
# Unset = auto-select: the BMAD_LOOP_MUX_BACKEND env var wins, then this key,
# then the platform default (win32: psmux, elsewhere: tmux) when installed,
# then the first registered backend that matches this platform and is
# available. Naming a backend that is not registered fails loudly at launch.
# `bmad-loop mux` lists backends and shows the selection; `bmad-loop mux set
# <name>` writes this key. Takes effect on the next bmad-loop invocation.
# backend = "tmux"
