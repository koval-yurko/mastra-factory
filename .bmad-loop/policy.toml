  '''sh -c 'node -e "const fs=require(\"fs\");const f=\"sandbox/factory-sandbox.Dockerfile\";let st;try{st=fs.statSync(f)}catch(e){console.error(\"missing \"+f+\" — the sandbox image exists to carry the git and gh command line tools into the agent container, and nothing else in this gate asserts that it does\");process.exit(1)}if(!st.isFile()){console.error(f+\" is not a regular file — a read of a directory or a device yields no apt-get install line, and the package census would then be read as empty on a subject this guard never opened\");process.exit(1)}const raw=fs.readFileSync(f,\"utf8\");if(raw.trim()===\"\"){console.error(\"empty \"+f+\" — there is no package list to census, and a census over nothing would pass vacuously\");process.exit(1)}const B=String.fromCharCode(92);const QS=new RegExp(\"[\"+String.fromCharCode(34,39)+\"]\",\"g\");const acc=[];let cur=\"\";for(const ln of raw.split(/\r?\n/)){const t=ln.replace(/[ \t]+/g,\" \").trim();if(t.charAt(0)===\"#\")continue;if(t.endsWith(B)){cur=cur+t.slice(0,-1)+\" \"}else{acc.push(cur+t);cur=\"\"}}if(cur!==\"\")acc.push(cur);let inv=0;const pk=[];for(const l of acc){const rn=l.match(/^\s*RUN\s+(.*)/i);if(!rn)continue;for(const seg of rn[1].split(/&&|[|;]/)){const m=seg.match(/^\s*(?:(?:sudo|env|-[^ ]+|[A-Za-z_][A-Za-z0-9_]*=[^ ]*)\s+)*(?:[^\s]*\/)?apt(?:-get)?\s+(?:-[^ ]+\s+)*install\s+(.*)/);if(!m)continue;inv=inv+1;for(const w0 of m[1].split(/\s+/)){if(!w0)continue;const w=w0.replace(QS,\"\");if(!w)continue;if(w.charAt(0)===\"-\")continue;pk.push(w.split(\"=\")[0])}}}if(inv===0){console.error(f+\" carries no RUN instruction whose command is an apt-get or apt install, after comment lines were dropped and backslash continuations joined — that is an extraction failure, not a pass: the census below would otherwise judge the image on an empty package list. An ONBUILD RUN does not count: it runs in a CHILD image, so an install deferred that way never reaches this one\");process.exit(1)}if(pk.length===0){console.erro