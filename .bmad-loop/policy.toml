  '''sh -c 'dq=$(printf "\42"); sq=$(printf "\47"); qq="[$dq$sq]"; for r in sandbox/README.md README.md; do test -s "$r" || { echo "missing or empty $r — NFR19 puts the date-stamped build and run commands for the sandbox image in sandbox/README.md, and step 6 of README.md is where the operator copies the tag the server actually runs into .env"; exit 1; }; test -f "$r" || { echo "$r is not a regular file — a grep over a directory or a device reports no matches, and this absence-of-match guard would then pass vacuously"; exit 1; }; m=$(grep -nE "factory-sandbox:latest|(-t|--tag)[[:space:]=]*$qq?factory-sandbox$qq?([[:space:]]|\$)|docker[[:space:]]+(run|image|tag)[[:space:]]+([^[:space:]]+[[:space:]]+)*$qq?factory-sandbox$qq?([[:space:]]|\$)" "$r"); test -z "$m" || { echo "$r documents an untagged or latest sandbox image: $m — NFR19 fixes the form at factory-sandbox:YYYY-MM-DD, and an untagged factory-sandbox is docker shorthand for factory-sandbox:latest, which is the one tag the operator can never tell two builds apart by"; exit 1; }; done' ''',
  '''sh -c 'node -e "const fs=require(\"fs\");let p;try{p=JSON.parse(fs.readFileSync(\"package.json\",\"utf8\"))}catch(e){console.error(\"package.json unreadable or not valid JSON: \"+e.message);process.exit(1)}if(p===null||typeof p!==\"object\"||Array.isArray(p)){console.error(\"package.json parsed but is not a JSON object: \"+JSON.stringify(p)+\" — a manifest that is not an object declares no scripts at all, and reading a property off it would kill this guard with a node stack trace instead of naming the file\");process.exit(1)}const s=(p.scripts||{}).start;if(typeof s!==\"string\"||s.indexOf(\"varlock run --\")===-1){console.error(\"package.json scripts.start is \"+JSON.stringify(s)+\" — it must go through varlock run --, the ONLY path on which .env.schema is applied at all: drop the prefix and the server boots on whatever the ambient environment happens to hold, every default, type and required check in the schema is skipped, and nothing fails loudly\");process.exit(1)}"' ''',
  '''sh -c 'd=$(command -v docker 2>/dev/null); test -n "$d" || { test -x /opt/homebrew/bin/docker && d=/opt/homebrew/bin/docker; }; test -n "$d" || { echo "no docker on PATH and none at /opt/homebrew/bin/docker, so docker-compose.yml is UNVERIFIED rather than satisfied — nothing else in this gate parses that file, and a typo in it would ship green. Put the engine on PATH: ops/factory-start.sh and both launchagent plists bake /opt/homebrew/bin in for the same reason"; exit 1; }; "$d" compose version >/dev/null 2>&1 || { echo "the docker at $d has no compose subcommand, so docker-compose.yml is UNVERIFIED rather than satisfied — the engine and the Compose CLI plugin are separate installs, and without this probe the next command would report a parse failure and blame a correct file. Link the plugin in as step 1 of ops/README.md shows: mkdir -p ~/.docker/cli-plugins, then symlink docker-compose into it"; exit 1; }; c=docker-compose.yml; test -f "$c" || { echo "missing $c, or it is not a regular file — it is the entire definition of the app-db service this deployment runs on"; exit 1; }; test -s "$c" || { echo "$c is empty. Compose rejects an empty file on its own, with an empty compose file diagnostic; this arm names WHICH file is empty rather than leaving that to be inferred from the engine output"; exit 1; }; rq=$(grep -oE "[$][{][A-Za-z_][A-Za-z0-9_]*:[?]" "$c" | sed "s/^..//; s/..$//" | sort -u | tr "\n" ","); test "$rq" = "POSTGRES_PASSWORD," || { echo "the keys $c marks REQUIRED with the :? interpolation form are [$rq], and they must be exactly [POSTGRES_PASSWORD,]. That key carries no default on purpose — a committed password would be a published credential — so rewriting it to the defaulting form still parses, still resolves, and hands every fresh deployment the same known password. It must also stay the ONLY required key: guards 49, 50 and 52 each export one throwaway POSTGRES_PASSWORD of their own before calling docker compose config, so a second required key