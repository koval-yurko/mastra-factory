#      Four of those arms exist because the resolved JSON was being held and only
#      partly read. Each of these was measured exiting 0 across all fifty-two
#      commands before its arm was added. Moving the mount target down to
#      `/var/lib/postgresql/data` puts `PGDATA` OUTSIDE the named volume — the
#      container starts, reports healthy, and loses the database on the next
