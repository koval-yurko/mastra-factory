#      SPEC.md, left all 33 commands green. Guard 25 covers the six owned-keys
#      READMEs; this half covers AGENTS.md and the contract documents, each of
#      which must still carry the new path by name.
#      TWO SETS, SWEPT DIFFERENTLY, because _bmad-output/ holds two kinds of
