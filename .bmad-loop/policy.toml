#      read while leaving the database answering nothing on 54329; an absent
#      `protocol` is read as `tcp`, which is what Compose means by it.
#      Two arms are about this guard failing HONESTLY rather than about the file.
#      `test[0]` must be `CMD-SHELL`, because the probe is read out of the LAST
#      element: the equally valid exec form `["CMD","pg_isready",…]` made the
#      guard report `probes role undefined` and blame a correct healthcheck. And
#      the `-U`/`-d` agreement requires both sides to be non-empty strings first,
#      because deleting `-U` from the probe AND `POSTGRES_USER` from
#      `environment:` made `undefined === undefined` pass — the comparison
#      succeeding, not the invariant holding.
#      This is the guard that makes the compose file's CONTENT checked rather
#      than merely parseable. Two drifts were measured passing all fifty-one
#      other commands: inverting the publish to `'54329:5432'`, which gives up
#      the loopback-only guarantee this file calls mandatory on a host that sits
#      behind a public tunnel, and drifting the healthcheck's
#      `${POSTGRES_USER:-…}` off the environment's, which makes the probe report
