#   1. THE RENAME LANDED, AND THE OLD FILENAME IS GONE.
#      docs/self-hosting-research.md is tracked as a real, non-empty file AND
#      present non-empty in the working tree — both halves, because the index
#      and the tree fail apart: a rename that has not been staged leaves the
#      index green while every citation resolves to nothing, and a staged
#      0-byte blob is green in the tree while the gate's own worktree, built
#      from tracked files only, gets an empty document. And
#      no tracked file in scope still names the space-carrying original. The
#      needle is the old FILENAME, matched case-insensitively — anchored on the
#      filename rather than on the English phrase, which is what keeps a
#      sentence like "see the self-hosting research notes" from failing the
#      gate, and which the hyphenated new name cannot match. The space was a
#      shell-quoting footgun on a path carried by 14 citations across seven
#      first-party files and by three literals inside guard 25, and the failure
#      mode of a stale citation is silence: it reads as correct and resolves to
#      nothing.
#      THREE SPELLINGS, not one, because a space in a path is exactly what
#      citations work around: the literal space, the %20 of a markdown link,
#      and the backslash-escaped form a shell line carries. With only the
#      literal spelling, `[notes](docs/Self-hosting%20research.md)` and
#      `docs/Self-hosting\ research.md` both passed. The old PATH is checked
#      separately against the tracked file list, since a file re-created there
#      reintroduces the footgun without any file having to cite it.
#      THE CITATIONS ARE ASSERTED POSITIVELY TOO. Sweeping for the old name
#      only pins the previous spelling: repointing both AGENTS.md citations at
