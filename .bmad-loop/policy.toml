  '''sh -c 'nv=$(npm --version 2>/dev/null); test -n "$nv" || { echo "npm --version produced nothing, so the packageManager pin in package.json has nothing to be compared against"; exit 1; }; node -e "const fs=require(\"fs\");let p;try{p=JSON.parse(fs.readFileSync(\"package.json\",\"utf8\"))}catch(e){console.error(\"package.json unreadable or not valid JSON: \"+e.message);process.exit(1)}if(p===null||typeof p!==\"object\"||Array.isArray(p)){console.error(\"package.json parsed but is not a JSON object: \"+JSON.stringify(p)+\" — a manifest that is not an object declares neither packageManager nor workspaces, and reading a property off it would kill this guard with a node stack trace instead of naming the file\");process.exit(1)}const v=process.argv[1];const want=\"npm@\"+v;const dec=p.packageManager;const base=typeof dec===\"string\"?dec.split(\"+\")[0]:dec;if(base!==want){console.error(\"package.json packageManager is \"+JSON.stringify(dec)+\" but the npm running this gate is \"+v+\", so the pin must read \"+want+\" (a +sha512 integrity suffix, which corepack use writes, is accepted and ignored) — a pin nothing compares against is decoration: npm installs cleanly against a pin naming a version that does not exist. Move the pin and the regenerated lockfile together in one commit; until that lands this guard fails EVERY subsequent unattended run.\");process.exit(1)}if(Object.prototype.hasOwnProperty.call(p,\"workspaces\")){console.error(\"package.json declares a workspaces key: \"+JSON.stringify(p.workspaces)+\" — this repo is ONE package; a workspaces key changes what npm ci installs and where node_modules lands, and nothing else here would notice\");process.exit(1)}" "$nv" || exit 1; all=$(git -c core.quotePath=false ls-files); test -n "$all" || { echo "git lists no tracked files, so the second-package census in this guard would pass vacuously"; exit 1; }; off=$(printf "%s\n" "$all" | grep -E "(^|/)(pnpm-workspace\.yaml|pnpm-workspace\.yml|pnpm-lock\.yaml|yarn\.lock|