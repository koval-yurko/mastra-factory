  '''sh -c 'node -e "const fs=require(\"fs\");const A=\"AGENTS.md\",S=\".env.schema\",CK=\"WORKOS_COOKIE_PASSWORD\",H=\"- Leave these unset\";const rd=p=>{try{return fs.readFileSync(p,\"utf8\")}catch(e){console.error(\"env-key census cannot read \"+p+\": \"+e.message);process.exit(1)}};const md=rd(A),sh=rd(S);const all=md.split(/\n/);const ms=all.findIndex(l=>l.trim()===\"<!-- bmad:context -->\"),mz=all.findIndex(l=>l.trim()===\"<!-- /bmad:context -->\");if(ms<0||mz<=ms){console.error(\"extraction failed: \"+A+\" carries no <!-- bmad:context --> ... <!-- /bmad:context --> managed block, so the env-key census has no bounded input\");process.exit(1)}const rl=all.slice(ms,mz+1);const mb=rl.join(\"\n\");const bt=String.fromCharCode(96);const dec=new Set();const dr=/^([A-Z][A-Z0-9_]*)=/gm;let m;while((m=dr.exec(sh))!==null)dec.add(m[1]);if(dec.size<40){console.error(\"extraction failed: only \"+dec.size+\" keys came out of \"+S+\", which is the only list of environment keys (AD-6), so this census would pass vacuously\");process.exit(1)}const tok=[];const tr=new RegExp(bt+\"([A-Z][A-Z0-9_*?]*)\"+bt,\"g\");while((m=tr.exec(mb))!==null){const t=m[1];if(tok.indexOf(t)<0)tok.push(t)}const gl=tok.filter(t=>t.indexOf(\"*\")>=0||t.indexOf(\"?\")>=0);if(gl.length){console.error(A+\" names environment-key GLOBS: \"+gl.join(\", \")+\". Name exact declared keys, one per member — a glob sweeps in keys that must stay SET, which is how \"+CK+\" (the second link of the OAuth/link state signer chain at src/mastra/config/integrations.ts) was told to be unset\");process.exit(1)}const keys=tok.filter(t=>t.indexOf(\"_\")>=0);if(keys.length<5){console.error(\"extraction failed: only \"+keys.length+\" backticked UPPER_SNAKE tokens came out of \"+A);process.exit(1)}const bad=keys.filter(t=>!dec.has(t));if(bad.length){console.error(A+\" names environment tokens \"+S+\" does not declare: \"+bad.join(\", \")+\". Name exact declared keys; if a token is not an environment key at all, declare it or w