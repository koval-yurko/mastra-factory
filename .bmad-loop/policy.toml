#  51. THE BOUND ON `db:up`, AND THE TWO SCRIPTS AROUND IT. `scripts["db:up"]`
#      in `package.json`, read through the same `try`/`catch` and
#      not-a-JSON-object check as guards 43 and 48, invokes `docker compose up`,
#      carries `--wait`, carries `--wait-timeout` followed by a positive integer
#      (separate token or joined with `=`), and does NOT also invoke
#      `docker compose down`. `scripts["db:down"]` invokes `docker compose down`
#      and carries no `-v`/`--volumes`. And every `--wait-timeout <N>` written
#      into `docker-compose.yml` and `ops/README.md` states the same N as
#      `db:up`.
#      What the bound is actually for, measured rather than reasoned, because the
#      obvious story turned out to be wrong. A bare `--wait` defaults to
#      `--wait-timeout 0`, which Compose documents as waiting forever. The
#      predicted hazard was a crash-looping container under
#      `restart: unless-stopped` — and on Compose 5.5.1 that does NOT hang:
#      measured twice in an isolated scratch project with a deliberately failing
#      `initdb`, `up -d --wait` with no timeout returned in about a second, rc=1,
#      `container … is unhealthy` on stderr, the container left `Restarting`. A
#      crash-looping container is classified unhealthy, and that ENDS the wait.
#      The unbounded wait is real for the other state: a container held in
#      `health: starting` has returned no verdict at all. Measured: a service with
#      `start_period: 600s` and an always-failing probe kept `up -d --wait`
#      running until an external watchdog killed it at 45s, the container still
#      `Up 44 seconds (health: starting)`; the same service with
#      `--wait-timeout 15` exited at exactly 15s, rc=1, `application not healthy
#      after 15s`. That is the case the bound ends, and it is why guard 52
#      additionally requires the timeout to EXCEED this service's own healthcheck
#      floor rather than merely being positive.
#      The `down` arms guard new state, not tidiness. With the project name
#      pinned by guard 50, a `docker compose down -v` hidden in any script
#      reaches the ONE live volume from ANY checkout, every story worktree
#      included. Without that arm
#      `docker compose down -v && docker compose up -d --wait --wait-timeout 120`
#      satisfies every other assertion in this guard.
#      The detection is token-aware, not substring-aware, because the substring
#      form missed exactly the spellings that matter. Measured passing against
#      `s.indexOf("docker compose down")`:
#      `docker compose -f docker-compose.yml down -v && docker compose up …`,
#      which puts a global flag between the command and the subcommand, and the
#      legacy `docker-compose down -v && …`, which is one token where the
#      substring expects two. So the scan finds a `docker compose` or
#      `docker-compose` invocation, steps over its global flags — consuming a
#      value for the ones that take one, `-f`/`-p`/`--env-file` and friends — and
#      asks whether the subcommand that follows is `down`. The volume ban then
#      matches `-v` exactly or ANY token beginning `--volumes`, because
#      `--volumes=true` is a real spelling that the exact-token check accepted.
#      And the ban is swept over EVERY value in `scripts`, not just the two keys
#      named above. A `"db:reset": "docker compose down -v && npm run db:up"` is
#      exactly as destructive as the same text inside `db:down`, and was
#      completely unguarded while only two keys were read. The per-key arms stay
#      because they say something the sweep cannot — `db:down` must still BE a
#      `docker compose down`, and `db:up` must not run one at all, with or
#      without `-v`.
#      Two cheaper forms were rejected. Equality against the exact script string
#      would fail the next time a flag is added to either side, and this guard is
#      about the bound, not the spelling. Merely requiring `--wait-timeout` to be
