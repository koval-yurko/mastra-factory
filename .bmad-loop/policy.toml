#      measured twice in an isolated scratch project with a deliberately failing
#      `initdb`, `up -d --wait` with no timeout returned in about a second, rc=1,
#      `container … is unhealthy` on stderr, the container left `Restarting`. A
#      crash-looping container is classified unhealthy, and that ENDS the wait.
#      The unbounded wait is real for the other state: a container held in
#      `health: starting` has returned no verdict at all. Measured: a service with
#      `start_period: 600s` and an always-failing probe kept `up -d --wait`
#      running until an external watchdog killed it at 45s, the container still
#      `Up 44 seconds (health: starting)`; the same service with
#      `--wait-timeout 15` exited at exactly 15s, rc=1, `application not healthy
#      after 15s`. That is the case the bound ends, and it is why guard 52
#      additionally requires the timeout to EXCEED this service's own healthcheck
#      floor rather than merely being positive.
