  '''sh -c 's=.env.schema; d=ops/launchagents; test -f "$s" && test -s "$s" || { echo "missing, empty, or not a regular file: $s — AD-6 makes it the only list of environment keys, and this census resolves the LaunchAgent environment against it. A directory here passes test -s on macOS and would reach the read below as a raw EISDIR stack trace instead of this line"; exit 1; }; test -d "$d" || { echo "missing $d — it holds the LaunchAgent plists whose EnvironmentVariables are the environment this deployment actually boots with, and this census has nothing to resolve without them"; exit 1; }; node -e "const fs=require(\"fs\"),cp=require(\"child_process\");const d=process.argv[1],s=process.argv[2];let fl;try{fl=fs.readdirSync(d).filter(f=>f.endsWith(\".plist\")).sort()}catch(e){console.error(\"cannot list \"+d+\": \"+e.message);process.exit(1)}if(!fl.length){console.error(\"no .plist under \"+d+\", so this census resolves nothing — the LaunchAgent definitions are the only record of the environment launchd hands the server\");process.exit(1)}const dl=new Set();for(const l of fs.readFileSync(s,\"utf8\").split(\"\\n\")){const m=/^([A-Za-z_][A-Za-z0-9_]*)=/.exec(l);if(m)dl.add(m[1])}if(dl.size<40){console.error(\"only \"+dl.size+\" key declarations could be read out of \"+s+\", fewer than this deployment declares — the extraction (a line beginning NAME=) has stopped matching and this census would value-check nothing\");process.exit(1)}let n=0;for(const f of fl){const p=d+\"/\"+f;const x=cp.spawnSync(\"plutil\",[\"-extract\",\"EnvironmentVariables\",\"json\",\"-o\",\"-\",p],{encoding:\"utf8\"});if(x.error){console.error(\"plutil could not be RUN at all (\"+x.error.message+\"), so nothing here was read. This census is macOS-only: the environment launchd gives the job lives in a plist and plutil is how it is read. A spawn failure is reported here rather than skipped, because a skipped plist looks exactly like one that declares no EnvironmentVariables and the vacuity floor woul