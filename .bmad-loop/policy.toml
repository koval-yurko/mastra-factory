  '''sh -c 'w=ops/factory-start.sh; test -s "$w" || { echo "missing or empty $w — it is the LaunchAgent entry point, and this guard asserts that its one exec line reaches the server through npm and therefore through varlock"; exit 1; }; test -f "$w" || { echo "$w is not a regular file — a grep over a directory or a device reports no matches, and the exec count would then be read as zero on a subject this guard never opened"; exit 1; }; xl=$(grep -nE "^[[:space:]]*exec[[:space:]]" "$w" | grep -vE "^[0-9]+:[[:space:]]*exec[[:space:]]+[0-9]*[<>&]"); xn=$(printf "%s\n" "$xl" | grep -c .); test "$xn" = "1" || { echo "$w must carry exactly one COMMAND exec line, found $xn: $xl — a redirection-only exec such as exec 2>&1 or exec >>logfile reconfigures the file descriptors of the wrapper instead of replacing the process, which is idiomatic in a launchd wrapper and is deliberately not counted here; a second COMMAND exec is unreachable code or a second server, and zero of them is a wrapper that returns to launchd instead of becoming the job"; exit 1; }; cmd=$(printf "%s\n" "$xl" | sed -E "s/^[0-9]+:[[:space:]]*exec[[:space:]]+//" | sed -E "s/[[:space:]]+#.*//" | tr -d "\042\047\015"); test -n "$cmd" || { echo "$w exec line carries no command this guard can read: $xl — that is an extraction failure, not a pass"; exit 1; }; if printf " %s " "$cmd" | grep -qE "[[:space:]](--prefix|--workspace|-w|--include-workspace-root)([[:space:]=]|$)|[[:space:]]-C"; then echo "$w exec line carries a package-root-redirecting npm option: $xl — --prefix, --workspace, -w, --include-workspace-root and -C each move the package.json npm resolves the start script from, in both the separate-value and the =-joined spelling. -C is the short alias npm itself documents for --prefix, declared as short: C on the prefix definition in @npmcli/config, so ANY token starting -C is rejected here, the attached-value spelling -C/elsewhere included. Such a line satisfies every other arm here and still runs some OTHE