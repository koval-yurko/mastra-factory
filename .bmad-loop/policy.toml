  "npx varlock load --format json",
  '''sh -c 'npx varlock load --format json-full | node -e "let s=\"\";process.stdin.on(\"data\",d=>s+=d).on(\"end\",()=>{const c=JSON.parse(s).config||{};for(const k of [\"MASTRA_HOST\",\"PORT\",\"DOCKER_HOST\"]){if(!c[k]||c[k].isSensitive!==false){console.error(\"env key not marked @public in .env.schema: \"+k);process.exit(1)}}})"' ''',
  '''sh -c 'l=$(git -c core.quotePath=false ls-files "*.ts" "*.tsx" "*.mts" "*.cts" "*.js" "*.jsx" "*.mjs" "*.cjs") || { echo "git ls-files failed, so this guard cannot judge AD-4 at all — that is an infrastructure failure, not a pass"; exit 1; }; test -n "$l" || { echo "git -c core.quotePath=false ls-files over the eight first-party TypeScript and JavaScript extensions returned nothing — that is an extraction failure, not a pass: src/ carries first-party source today, so an empty listing means a broken pathspec or a broken index, and the absence-of-match arm below would be meaningless"; exit 1; }; o=$(printf "%s\n" "$l" | grep -v "^src/"); test -z "$o" || { echo "first-party source outside src/, which AD-4 forbids and which tsc never sees because tsconfig.json is include: src/**/* only (guard 21 pins that literally):"; printf "%s\n" "$o"; exit 1; }' ''',
