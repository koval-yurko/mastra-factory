#     wider, matching any later `process.env[` including a bracketed literal.
#     WHAT THE NARROWING TURNS OUT NOT TO FIX, recorded so nobody re-derives it:
#     a single line carrying BOTH spellings —
#     `Boolean(process.env["POSTGRES_USER"]) && Boolean(process.env[zz])` — does
#     not double-count either way. Measured: `grep` is leftmost-longest, so the
#     bracketed-literal pattern consumes the quoted name before this one reaches
