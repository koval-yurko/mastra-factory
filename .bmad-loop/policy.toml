#  44. THE TWO `@public` POSTGRES KEYS. Guard 4's pipeline — `npx varlock load
#      --format json-full` into `node -e`, failing when a key is absent from the
#      loaded config or its `isSensitive` is anything but `false` — with the key
#      list `["POSTGRES_USER","POSTGRES_DB"]`. It is a mirror of guard 4 rather
#      than a widening of it on purpose: guard 4's three keys are the server's
#      own, these two are Compose's, and the two lists go stale for different
#      reasons. `.env.schema`'s header sets `@defaultSensitive=true`, so these
#      two are public only because of the `# @public` line directly above each;
#      delete that one line and varlock masks the value in the stdout of
#      `varlock run -- mastra start` and in every dump, which is where the
#      operator and `docker compose` read them. Grepping `.env.schema` for the
#      literal `# @public` was rejected: it proves the bytes are in the file, not
#      that varlock resolved the key as public, which is the thing that matters.
#      What guard 4 does NOT do, and what this one has to, is separate a masked
#      key from a broken schema. Measured: with `.env.schema` DELETED, `varlock
#      load --format json-full` exits 0 and writes well-formed JSON whose
#      `config` simply has no such keys, and with the schema UNPARSEABLE it still
#      writes well-formed JSON on stdout — so a `try`/`catch` around `JSON.parse`
#      never fires in either case, and the census would blame the two POSTGRES
#      keys for a schema that is broken or absent. The order is therefore: the
#      schema must be a non-empty file (catches deleted and emptied), then
