#  43. THE SINGLE-PACKAGE SHAPE. Three assertions about `package.json` and the
#      index, in one guard because they are one claim: this is ONE npm package.
#      (a) `packageManager` is exactly `npm@` + the output of `npm --version`,
#      after a trailing `+<suffix>` is stripped from the declared value: the
#      canonical way to write this pin is `corepack use npm@11.17.0`, which
#      writes `npm@11.17.0+sha512.<hash>`, and a guard that told the maintainer
#      to strip the hash corepack just added would be wrong about the repo.
#      The message prints the value as DECLARED, hash and all, so it is
#      searchable in the file.
#      (b) There is no `workspaces` key at all — the test is `hasOwnProperty`
#      rather than truthiness, because an empty array is still a workspaces
