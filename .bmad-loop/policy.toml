# bmad-loop orchestration policy. All keys optional; defaults shown.

[gates]
mode = "per-epic"            # none | per-epic | per-story-spec-approval
retrospective = "notify"     # never | notify | auto (auto unsupported in v1)

[limits]
max_review_cycles = 3
max_dev_attempts = 2
artifact_file_max_mb = 5    # raw-byte cap for each ignored artifact selected for publication
artifact_payload_max_mb = 10 # raw-byte cap across all selected ignored publication artifacts
max_followup_reviews = 1     # additional review rounds granted solely because a finalized (status: done) round still recommended a follow-up; once spent, such a round converges + refiles the recommendation instead of burning another cycle. 0 = never honor a pass's own recommendation
session_timeout_min = 90
git_timeout_s = 120          # bound on any single git subprocess; exceeding it pauses/degrades (never crashes the run) — raise on a loaded host or a very large worktree
teardown_grace_s = 20        # verified teardown: poll a killed session window up to this long, then force-kill its pane pids and re-kill (#157). 0 = single unverified best-effort kill
stop_without_result_nudges = 1
dev_stall_grace_s = 600      # silence grace armed at dev/review launch and re-armed by transport activity or fresh Stop/idle evidence before bounded recovery. 0 = no launch timer, but a result-less turn end still fails fast
dev_stall_nudges = 2         # best-effort wake nudges per silent grace before stalling; fresh Stop/idle evidence restores this budget. 0 = stall on grace expiry
dev_stall_nudges_cap = 6     # total (never-restored) nudge bound per dev/review session; bounds launch-time recovery and Stop/idle budget refills because an accepted nudge does not guarantee a wake. 0 = stall on first grace expiry
workflow_stall_nudges_cap = 3 # total (never-restored) stall nudges for an injected plugin-workflow session before it is called stalled; bounds a session that finished its work but never wrote its completion marker. 0 = stall on first grace expiry
dev_contract_nudge = true    # true: one targeted nudge per session (#276) when a Stop finds a spec finalized to a terminal frontmatter status but missing its `## Auto Run Result` marker, asking the skill to append it and end its turn; sent exactly once, never refilled, touches no stall counters. false: rely only on harness-side frontmatter synthesis
max_tokens_per_story = 1000000   # lowered from 2M: these stories are small, config-shaped edits
cache_read_weight = 0.1      # cache reads bill at ~0.1x input on all vendors; 1.0 = count raw
session_budget_mode = "warn"  # off | warn | enforce — weighted per-SESSION cap sampled every ~30s mid-session; warn = one ATTENTION + breadcrumb; enforce = wrap-up nudge (best-effort courtesy; the kill is the guarantee) then over_budget termination (retry→defer). Live-verified on claude; other transcript parsers sample best-effort (mid-turn flush unverified); inert where no mid-session usage signal exists (usage_parser "none", copilot's shutdown-only flush)
max_tokens_per_session = 4000000 # weighted cap a single session may spend before the guard trips; healthy sessions run ~1-2.5M weighted, so the default trips only true runaways (#158)
session_budget_grace_s = 240 # enforce mode: seconds a tripped session gets to wrap up after the nudge before over_budget termination. 0 = terminate at trip, no nudge

[verify]
# Deterministic gates run by the orchestrator after a clean review, before commit.
# `npm ci` first: worktree isolation checks out tracked files only, so a fresh
# story worktree has no node_modules and `tsc` would fail for the wrong reason.
#
# The two guards after the typecheck enforce AD-4 and AD-9/AD-13, which prose in
# AGENTS.md can only ask for:
#   1. No first-party .ts/.tsx/.mts/.cts/.js/.jsx/.mjs/.cjs outside src/.
#      tsconfig.json is include: ["src/**/*"], so `tsc --noEmit` never sees such
#      a file and it ships unverified. Prints every offending path and fails, and
#      reports an empty listing as an extraction failure rather than a pass.
#      Those eight extensions are the set guards 26, 35, 36, 38, 39 and 41 all
#      sweep under src/, so the whole gate agrees on one spelling of first-party
#      TypeScript and JavaScript. It is NOT the whole of AD-4, which bans those
#      four extensions "or other program source": a tracked ops/probe.py passes.
#      See the block above the array for why the pathspec was widened from four.
#   2. .agents/skills/ is untouched. Its content is hash-locked in
#      skills-lock.json by the Mastra CLI; that hash is not reproducible from
#      the files with shasum, so this asserts the tree is unmodified instead.
#      Catches uncommitted edits, which is where verify runs (after review,
#      before commit) — a session that committed the edit first would slip past.
#
# `npm test` is APPENDED, never substituted for the list: the two guards above
# are enforced nowhere else, so rewriting this array would silently delete them.
# It runs `vitest run --dir src` — vitest on its defaults (AD-3: no
# vitest.config.ts at root), scoped to src/. The scope matches guard 1 above,
# which admits first-party TypeScript anywhere under src/: scoping any narrower
# would let a test outside that subtree typecheck, pass both guards and never
# run, with the gate still reporting green. What --dir is actually for is
# keeping the scan from descending into the worktree copies under
# .bmad-loop/runs/, which vitest's defaults DO collect (they are gitignored, but
# vitest does not read .gitignore).
#
# `varlock load` resolves .env.schema, which nothing else in the gate opens:
# `tsc` is include: ["src/**/*"], vitest runs --dir src and its preamble deletes
# every variable the entry reads, and neither guard below looks at a non-.ts
# file. So an unresolvable schema — an unbalanced quote in a decorator, a key
# wrongly marked required — ships green and first appears as a crash-looping
# launchd job, because `npm start` is `varlock run -- mastra start`. It resolves
# the schema alone here: .env is gitignored and absent from a story worktree.
#
# That absence is also the constraint this command imposes: with no .env every
# value is empty, so an UNCONDITIONAL `@required` anywhere in .env.schema fails
# this gate in every story worktree, whether or not the declaration is right.
# Every @required in the schema today is conditional (`@required=not(isEmpty(
# $OTHER_KEY))`) and stays false while its dependency is empty, which is why the
# gate is green. A key that genuinely must be supplied in production is declared
# the same conditional way, or documented as required in prose — never as a bare
# `@required`, which this gate cannot distinguish from the mistake above.
#
# The `json-full` guard covers what `json` cannot see: sensitivity. The header of
# .env.schema is `@defaultSensitive=true`, so a key that loses its `# @public`
# line is masked in the stdout of `varlock run -- mastra start` — the deployment's
# only diagnostic surface, and the one ops/README.md teaches the operator to read
# for a wrong bind address. `--format json` emits resolved values only and carries
# no sensitivity field, and unset keys do not appear in it at all, so dropping the
# annotation exits 0 through every other command here. Verified both ways in a
# story worktree: the guard passes as written and fails naming the key when a
# `# @public` line is removed.
#
# The next eleven guards cover ops/, which nothing else here opens: `tsc` is
# include: ["src/**/*"], vitest runs --dir src, and the AD-4 path guard filters
# eight TypeScript and JavaScript extensions, so a plist, a shell script and a
# newsyslog conf are all invisible to every command above. (This contiguous run
# of eleven is not the whole set: later entries read ops/ paths too, and entry
# 61 is appended at the very END rather than beside these because this array is
# append-only; see its own block. So "the guards that open ops/" is neither
# eleven nor contiguous, and how many there are in total is deliberately NOT
# stated here — a draft of this paragraph said "twelve" and the real number was
# already 22, which is the rot guard 53 rejects in AGENTS.md. Point at the
# array: grep it for `ops/`.)
# They are launchd's own inputs, so a mistake in one surfaces as a crash-looping
# or silently-misconfigured agent rather than as a failed build:
#   1. `plutil -lint` on both plists — launchd refuses a malformed property list
#      and reports it only in its own log.
#   2. `zsh -n` on both ops/*.sh — a syntax error in the wrapper is a job that
#      never starts, and in the installer a partial placement.
#   3. Both ops/*.sh are mode 100755 in the index. launchd execs the wrapper by
#      path and `ops/install.sh` refuses to link a non-executable one; a lost
#      +x is invisible in a diff. Counts the 100755 rows and requires exactly 2,
#      so a wrong mode and a missing file both fail while the correct tree passes.
#   4. The one baked repo root agrees across all three files that hard-code it.
#      Every path in the plists is absolute (launchd never expands $HOME), so a
#      moved repo has to be rewritten in three places at once. Reads
#      EXPECTED_ROOT out of ops/install.sh and requires the factory plist's
#      WorkingDirectory, its ProgramArguments wrapper path and the wrapper's own
#      REPO_ROOT to match it. Verified both ways in this worktree: passes as
#      written, fails when any one of the four is pointed elsewhere. Both `sed`
#      reads strip quotes, so quoting either literal — which the surrounding
#      style invites — does not fail the gate with a misleading message.
#   5. Each plist's Label equals its filename stem, it carries no UserName key,
#      and no value in it contains a literal $HOME. plutil -lint above proves
#      well-formedness only, and all three are things launchd acts on silently:
#      a job registers under its Label, so a label-addressed `launchctl
#      kickstart` misses a job that is loaded and running; UserName is the
#      daemon spelling this deployment must not use (agents, not daemons); and
#      launchd never expands $HOME, so such a path is simply never created.
#   6. The rotation conf parses: every non-comment row is one of exactly four,
#      on the specified terms `koval:staff 644 7 10240 * NJ`. Guards 1-4 never
#      open this file — it could be deleted outright and the gate stayed green —
#      and its failure mode is silence, since an unrotated log just grows.
#   7. The log paths agree between the conf and the plists, and sit under the
#      EXPECTED_HOME that ops/install.sh creates. This is the drift these files
#      exist to eliminate and the one docs/self-hosting-research.md §7 carried
#      until Story 5.3 replaced its copies of these artifacts with path
#      references: a conf row naming a file no plist writes rotates nothing, and a
#      plist log path outside the directory the installer creates is an agent
#      that will not spawn. Guard 4 reconciles the repo root only.
#      Together, 4 and 7 are AD-11's "update the plist, the wrapper and the conf
#      in the same change" made mechanical.
#   8. The rotated log paths agree between the conf and the ONE paragraph of
#      ops/README.md that claims to list them: supervision checkpoint 4, which
#      tells the operator a `sudo newsyslog -nvv` dry run prints all four by
#      name. Guard 7 reconciles the conf against the plists; nothing here reads
#      the prose, and the prose is what the operator actually runs, so a fifth
#      row added to the conf or a renamed one leaves the README teaching the
#      wrong expected list and the right one as a fault.
#      docs/self-hosting-research.md §7.4 was the live proof that a conf and
#      its narrative drift apart in silence: it carried the superseded
#      three-row version until Story 5.3 replaced the block with a reference to
#      the conf itself, which is what guard 32 below now keeps true. Scoped and
#      compared deliberately: the README side is the `### 4 — rotation is in
#      force` section only (sliced to the next `### 5 `), so prose elsewhere —
#      a rotated-generation glob in checkpoint 3, a bare `out.log` in a
#      sentence — is neither a claim nor a false failure; and both sides are
#      compared as whole absolute paths rather than bare basenames or a shared
#      tail, so a home or directory rewritten on either side alone is caught
#      too — a tail-only comparison passed a checkpoint 4 that named
#      /Users/bob, which is the drift this guard exists for.
#      Verified both ways in this worktree: passes as written, and fails naming
#      ops/README.md when a conf row is dropped, when a fabricated path is added
#      to checkpoint 4, when one of checkpoint 4's four expected paths is
#      deleted, and when the home is rewritten on either side alone; a novel log
#      path written outside the sliced section still passes, and a deleted
#      ops/README.md or conf is reported as missing rather than as disagreement.
#   9. Every launchd job name ops/README.md addresses is one the plists
#      actually declare, read two ways: the `gui/$(id -u)/<name>` service
#      targets against each plist's Label, and the
#      `~/Library/LaunchAgents/<name>.plist` paths the bootstrap and teardown
#      commands name against the plist filenames. Guard 5 pins each Label to
#      its filename stem; nothing pins the prose, and the prose is what the
#      operator types. A renamed job silently orphans every `launchctl
#      kickstart`, `bootout` and `print` command in that document — the
#      recovery proofs are built out of them — and launchctl reports an unknown
#      job name as a bare `No such process` and nothing else; the reverse,
#      prose naming a job no plist declares, reads identically. Two extraction
#      details. The service-target class [A-Za-z0-9_.-] admits a trailing `.`,
#      so an un-backticked job name ending a sentence would be read as
#      `ai.mastra.factory.` and fail a correct document; trailing `.` and `-`
#      are stripped before the comparison. And the filename side requires the
#      capitalised `LaunchAgents/` directory, so the lowercase
#      `ops/launchagents/` references in the same prose are not swept in. The
#      literal `<label>` placeholder in supervision checkpoint 1 and the bare
#      `gui/$(id -u)` of the four `bootstrap` calls both match nothing.
#      Verified both ways in this worktree: passes as written, and with a
#      sentence-ending `gui/$(id -u)/ai.mastra.factory.` added; fails naming
#      both sides when a plist Label is rewritten, when a fabricated
#      gui/$(id -u)/ai.mastra.nope is added, and when a
#      LaunchAgents/<name>.plist the prose bootstraps is renamed.
#  10. The `[factory] …` lines ops/README.md greps out.log for are printed
#      verbatim by ops/factory-start.sh. Recovery proof 3's entire result is
#      two such greps and supervision checkpoint 3 carries a third, and nothing
#      else in this gate compares the two files: a reworded `print` in the
#      wrapper leaves every one of those greps matching nothing — a guaranteed
#      false failure for the operator — while all fifteen commands above stay
#      green. Scoped to the grep arguments (`grep -F '[factory]…'`, which also
#      catches the `bzgrep` form), not to every [factory] string in the file,
#      so a full line quoted inside a sentence stays narrative rather than
#      becoming a claim. Verified both ways in this worktree: passes as
#      written; fails naming the text when ops/factory-start.sh:72's "waiting
#      up to" or :107's "docker socket is up" is reworded, and when the README
#      greps for a line the wrapper never prints.
#  11. The forced rotation in recovery proof 4 names a log the conf actually
#      rotates. `sudo newsyslog -F <path>` is the one command in this document
#      that trims a real log; its path argument is what keeps the run off every
#      other conf in /etc/newsyslog.d/, and it sits one heading below guard 8's
#      slice, so nothing read it — the deployment home could be moved in the
#      conf, both plists and ops/install.sh while that one line stayed on
#      /Users/koval, with guards 4, 5, 7, 8 and 9 all passing. Only the last
#      field of a `newsyslog -F …` command is extracted, rather than widening
#      guard 8's path regex over the whole file, which would sweep in
#      out.log.0.bz2 and checkpoint 3's bzgrep glob and fail on correct prose.
#      Verified both ways in this worktree: passes as written; fails naming the
#      path when the home is rewritten in that argument alone, when the conf
#      row it names is renamed, and when the path argument is dropped from the
#      command altogether — which is the bare `-F` form that would trim every
#      log on the host.
#
# The last six guards are structural: they check WHERE files are, which every
# command above takes for granted. All eighteen read particular files by path, so
# each of them is silent about a file that moved, vanished or appeared — the
# layout rules in ARCHITECTURE-SPINE.md (AD-3, AD-4, AD-5) were enforced by
# nothing until these. Guards 1, 2, 4 and 6 read the tree through `git`, so
# gitignored paths (.env, node_modules/, .mastra/, .bmad-loop/runs/) are out of
# view by construction and a story worktree — which checks out tracked files only
# — sees exactly what the gate asserts; guard 2 additionally reads the spine it
# enforces, guard 3 reads tsconfig.json from disk because that file IS its
# subject, and guard 5 is deliberately a working-tree check (see below).
#
# TWO SURFACES, BOTH ASSERTED. The index and the working tree can disagree, and
# each catches what the other cannot. A fresh story worktree checks out the INDEX,
# so a staged 0-byte blob or a staged symlink ships the wrong bytes even when the
# file on disk is perfect. But the orchestrator does NOT commit the index it
# verified: `bmad_loop.verify.finalize_commit` runs `git add -A` after this gate
# passes, so the WORKING TREE is what the story commit carries — an unstaged `rm`
# or `: >` of a seeded artifact, or a stray untracked file at root, would be
# verified green and then committed. Guards 1 and 5 are therefore the same rule at
# the two surfaces, and guard 2 reads both (`git ls-files` plus `git ls-files -o
# --exclude-standard`, which keeps gitignored paths out of view exactly as before).
#   1. All 12 operational artifacts the spine's Structural Seed names are tracked
#      as real, non-empty files (AD-5: "every operational artifact exists as
#      exactly one real file at its own path"). Nothing above notices a deleted
#      artifact as a deletion: guards 8-11 compare ops/README.md against the conf,
#      the plists and the wrapper, and report a missing file only when they happen
#      to open it; apps/*/README.md, apps/slack/manifest.yaml, sandbox/README.md
#      and sandbox/factory-sandbox.Dockerfile are opened by no command here at
#      all, so any of them could be deleted or emptied with the gate staying
#      green. Asserted against the INDEX — `git ls-files -s` mode and
#      `git cat-file -s :<path>` — because the index is what a fresh worktree
#      checks out; guard 5 below asserts the same twelve paths in the working
#      tree, which is what the story commit carries. Both
#      halves matter and were verified: a path staged as a 0-byte blob with the
#      full file still on disk passes a working-tree `test -s` but fails here, and
#      a path staged as mode 120000 (symlink) likewise — `test -s` follows the
#      link and sees the target's bytes, while the worktree would check out a
#      symlink rather than the artifact. Mode must be 100644 or 100755.
#   2. Root is the closed set AD-3 enumerates, and the two lists are DERIVED from
#      ARCHITECTURE-SPINE.md rather than copied here: the allowlist from the AD-3
#      table's rows, the directories from its closed-set bullet. That is the whole
#      point — a hand copy would let a session widen root by appending one name to
#      a `case` pattern with the spine untouched, which is exactly the silent
#      local root addition AD-3 forbids and this guard exists to prevent. Now the
#      only way to admit a new root entry is to amend AD-3, which is the spine
#      change AD-3 asks for. Resolves exactly one spine file and fails loudly if
#      the glob matches none or several, or if either extraction comes back
#      without `package.json` / `src` — a silently empty list would admit
#      everything. Emptiness is not the only way an extraction goes wrong, and the
#      other way widens instead of narrowing: both `sed` ranges must actually
#      TERMINATE on their closing anchor, or sed prints to end of file and the
#      closed set absorbs every backticked path in the rest of the spine. Verified:
#      with the directory bullet's old prose end anchor reworded, a tracked root
#      `config/` was admitted, because `config` is backticked further down the
#      document. So the directory range now ends on the next bullet (`**Root
#      allowlist — closed set`) rather than on a sentence, and both ranges assert
#      their last extracted line matches the closing anchor. Three assertions on
#      the sets themselves: every root file is in the allowlist, every root
#      directory is in the closed set, and every allowlist entry git does not
#      report as ignored is actually tracked. The third is what makes "root is
#      exactly these" true in both directions; without it `git rm --cached
#      docker-compose.yml` left the gate green. It asks `git check-ignore` rather
#      than hardcoding `.env` — the one hand-copied element left in an otherwise
#      derived guard, which made a second gitignored AD-3 row (`.env.local`, say)
#      fail as "not tracked at root". The directory side stays a subset check
#      because node_modules/ is never tracked. Paths are
#      read with `git -c core.quotePath=false ls-files` AND `ls-files -o
#      --exclude-standard` (see TWO SURFACES above — an untracked stray root file
#      passed this guard and was then committed by the orchestrator) through
#      `while IFS= read -r`, collecting offenders and failing outside the pipeline:
#      the old
#      unquoted `$(git ls-files)` word-split `my config.json` into an offender
#      named `my`, and C-quoted a legal `docs/café.md` into a FALSE failure on
#      `"docs`. Nothing above looks at root as a set — the AD-4 path guard filters
#      by extension, so a stray root .md, .yaml or .json passes it. The message
#      names the offender in full, states that tracked and untracked-but-not-
#      ignored both count and why, and says which of the two fixes applies: move it
#      under its subject, or amend AD-3 naming the tool that fixes its location
#      (the test the four non-obvious entries — AGENTS.md, README.md,
#      skills-lock.json, .mastra-project.json — pass).
#   3. tsconfig.json `include` is exactly ["src/**/*"]. This is the premise both
#      `npm run check` and the AD-4 path guard rest on, and neither can see it:
#      widening `include` makes `tsc` cover more, so the typecheck still passes,
#      and the path guard keeps filtering the same extensions. AD-4 calls
#      widening it a spine change; `tsc` cannot report its own blind spot, so the
#      one entry is asserted literally here. Fails naming the value found,
#      including when the key is dropped altogether (which silently makes tsc
#      include everything). `tsc` accepts JSONC, so `//` line comments are
#      stripped before parsing and the read+parse is wrapped: a legal `// src
#      only` line made a bare JSON.parse die with an uncaught SyntaxError and a
#      stack trace instead of a guard message, and a missing file threw ENOENT the
#      same way. Anything still unparseable is reported as "tsconfig.json
#      unreadable or not valid JSON: <message>", so this guard always fails as
#      itself. Only full-line comments are stripped, never a `//` inside a string.
#      Known and deliberate limit: three other JSONC forms `tsc` accepts — a `/* */`
#      block comment, a `//` after a value, a trailing comma — are reported as
#      unparseable rather than accepted. That is a false gate failure on a legal
#      file, traded against regex-stripping JSONC properly; it fails loudly with
#      the message above, and the honest fix (`tsc --showConfig`) would resolve
#      `extends` and so stop asserting what AD-4 asks for, which is that
#      tsconfig.json ITSELF reads include: ["src/**/*"]. Delete the comment, or
#      widen the stripping, the day someone needs one.
#   4. .agents/skills/ AND skills-lock.json are unchanged in the INDEX, asserted
#      as one sha256 over their combined `git ls-files -s` line set (mode, blob
#      sha and path per file). Both, because they are the two halves of the same
#      AD-13 rule and this guard's own message tells the maintainer to move them
#      together — with the tree alone pinned, a committed edit to the lockfile's
#      `computedHash` passed all 22 commands. The
#      `git status --porcelain` guard above compares the working tree and the
#      index against HEAD, so it catches an edit that is merely unstaged or
#      staged but goes blind the moment the edit is COMMITTED — verified: after
#      `git commit` of an edit under that tree it exits 0 while this guard exits
#      1. AD-13 calls this tree vendored and never hand-edited, and
#      skills-lock.json's own `computedHash` is not reproducible from the files
#      (tried: sha256 of SKILL.md, of its content without the trailing newline,
#      and of both files concatenated), so a guard cannot re-derive it — git's
#      content addressing is the substitute. Hashing the index rows catches an
#      edit, an addition and a deletion alike, needs no knowledge of the CLI's
#      internals, and changes only when the tracked content changes. The digest is
#      a pinned literal on purpose: a legitimate update through the Mastra CLI
#      moves skills-lock.json and this constant in one commit, which is the review
#      moment AD-13 wants — a coupling AD-13 itself now states, so it is not
#      knowledge trapped in this comment. Prints both digests so the new value is
#      copy-pastable. `git`'s exit status is checked on its own, before hashing,
#      and the row set is checked for emptiness: an earlier draft tested only the
#      digest for emptiness, which never fires, because `shasum` of empty input is
#      the perfectly non-empty e3b0c442… — so a failing git reported "digest
#      changed: found e3b0c442…" and told the maintainer to regenerate a vendored
#      tree that was fine. Infrastructure failure now says so.
#   5. The same twelve seeded artifacts as guard 1, asserted in the WORKING TREE
#      (`test -L`, `test -f`, `test -s`). See TWO SURFACES above: `git add -A` in
#      the orchestrator's finalize step is what commits the story, so an unstaged
#      `rm apps/github/README.md` or `: > apps/slack/manifest.yaml` passed the
#      index-only guard 1 and was then committed — verified before the fix, and the
#      matrix row this story was written against names exactly that mutation. The
#      symlink arm is first because `test -f`/`test -s` follow links and would
#      accept one.
#   6. skills-lock.json is unmodified in the working tree or index, mirroring the
#      pre-existing `git status --porcelain -- .agents/skills` guard, whose
#      pathspec stops at that tree and so never saw its sibling. Guard 4 pins both
#      files in the INDEX, which is what catches a COMMITTED edit; this catches the
#      unstaged one, which all 22 earlier commands passed green — the same
#      two-surface split as guards 1 and 5. Appended rather than widening the
#      existing pathspec, because `[verify].commands` is append-only.
# All six verified both ways in this worktree: they pass as written, and fail
# naming the offender when a seeded conf is removed from the index, when
# apps/slack/manifest.yaml is truncated, when it is staged as a 0-byte blob with
# the full file on disk, when a seeded path is staged as a symlink, when a
# vitest.config.ts is tracked at root, when a root file with a space in its name
# is tracked (named in full), when an AD-3 allowlist entry is untracked, when a
# tests/ directory is added, when the AD-3 table or closed-set bullet cannot be
# extracted, when `include` is widened to ["src/**/*", "ops/**/*"] or removed,
# when tsconfig.json is malformed or absent, and when an edit, an addition or a
# deletion under .agents/skills/ — or an edit to skills-lock.json — is staged or
# committed, the committed case being the one the `git status` guard above stops
# catching. And at the working-tree surface: when a seeded artifact is truncated,
# deleted or replaced by a symlink WITHOUT staging it, when a stray root file or
# root directory is merely untracked, when skills-lock.json is edited without
# staging it, and when either spine extraction range would run past its closing
# anchor. Verified NOT to fail on the legitimate cases that broke the earlier
# drafts: a non-ASCII path like docs/café.md, a JSONC full-line comment in
# tsconfig.json, an AD-3 table de-indented by a markdown formatter, a second
# gitignored AD-3 allowlist row, and a full `npm ci && npm run check && npm test`
# run, which leaves no untracked non-ignored file for guard 2 to trip on. A root
# name added to the AD-3 table is admitted only once the
# spine says so, which was checked by adding one and removing it again.
#
# The last six guards are AD-6: environment-key truth is split by nature, and
# neither half was checked. `.env.schema` is the only list of keys; the owning
# subject README is the only record of what a value must contain and how to
# obtain it. Entries 2 and 3 above open the schema — they resolve it and read
# one sensitivity marking — and nothing at all opened the READMEs, so the split
# existed as prose in six opening paragraphs and as an audit somebody ran once.
# These six make it a gate. All are `git`-mediated or read fixed paths, so the
# operator's `.env` is out of view by construction (it is gitignored, and guard
# 5 asserts that it stayed that way).
#   1. THE OWNERSHIP PARTITION. Each of the six READMEs — the five operator-plane
#      subjects plus README.md, which AD-6 now names the residual owner for keys
#      with no subject directory — carries a `## Keys this subject owns` section
#      (`## Keys this file owns` in README.md). The six owner PATHS are a literal
#      list here, unlike guard 19, which derives root from AD-3: AD-3's root
#      closed set contains directories that are not owned-keys subjects (src/,
#      docs/, .agents/ …), so it is not the right source, and there is no other
#      machine-readable enumeration of the owners. What is derived is everything
#      that matters — the key sets themselves, read out of the six tables.
#      Each file must carry EXACTLY ONE such heading, counted before anything
#      else: with two, sed would end the first section's range at the second and
#      every row below it would go unclaimed, which is the same silent widening
#      as the EOF case and was verified to pass before the count was added. The
#      slice then runs to the NEXT `## ` heading and must actually terminate on
#      one, so a section written last in its file cannot run to EOF and claim
#      every backticked key in the rest of the document. Each extraction is
#      checked for emptiness, so a renamed column or a row written without
#      backticks fails loudly rather than passing vacuously. The row regex is
#      whitespace-tolerant around the backticked first cell: a markdown formatter
#      that pads cells to align columns would otherwise make every row vanish and
#      a doubly-claimed key pass — the same coupling Story 5.1 had to patch.
#      Three assertions on the sets: no key is claimed twice (the message names
#      the key AND both files), every claimed key is declared in .env.schema, and
#      every declared key is claimed by exactly one README. The last is what
#      makes the partition TOTAL — without it a key could be dropped from every
#      README and the gate stay green.
#      A fourth assertion pins WHICH subject, for the four families whose owner
#      is mechanical: GITHUB_APP_* to apps/github/, LINEAR_* to apps/linear/,
#      SLACK_APP_* to apps/slack/, FACTORY_SANDBOX_* to sandbox/. Disjointness
#      and totality alone do not say that — moving the SLACK_APP_BOT_TOKEN row
#      into README.md's residual table left the partition total and the gate
#      green, with a Slack key's record claiming to live at root. This is a
#      prefix rule, not the per-key enumeration AD-6 declined to write down: it
#      does not go stale when a key is added, only when a family is.
#      Each section must also reference `docs/self-hosting-research.md` §11, the
#      trap table, BY PATH rather than copying it. The guard asserts that file
#      EXISTS as well, so the coupling bites in both directions: renaming it
#      without touching the READMEs left six dangling references and all six
#      guards green. That path was a deliberate forward dependency, and Story 5.3
#      spent it: the document was renamed off its space-carrying name, and the
#      three literals in this guard moved with all six READMEs in that one
#      change. The rest of 5.3's own criterion — that a repo-wide search for the
#      old path comes back empty — is guard 31 below, which is also why this
#      guard's three literals are the only ones here that were ever allowed to
#      change: `[verify].commands` is otherwise append-only.
#   2. Every literal `process.env` read under src/ is declared in .env.schema,
#      in both the `process.env.KEY` and the bracketed `process.env["KEY"]` /
#      `process.env['KEY']` spellings. AC2's own wording is "every key the
#      deployment sets", but the deployment's .env is untracked and invisible
#      here; a key first-party code READS is the same set one step earlier and is
#      greppable. Six keys were read and declared nowhere when this was written
#      (NODE_ENV, REDIS_URL, E2B_API_KEY, MASTRACODE_AUTH_DISABLED,
#      MASTRACODE_GITHUB_AUTHORIZED_BOTS, MASTRACODE_DISPATCH_MAX_IN_FLIGHT).
#      Paths come from `git -c core.quotePath=false ls-files` over every
#      first-party extension AD-4 admits, so a non-ASCII filename is not silently
#      skipped as a C-quoted string.
#      TWO CLASSES USED TO STAY INVISIBLE to it; one still does, and correctly.
#      `process.env[key]` over LOCAL_SANDBOX_ENV_KEYS forwards HOST variables
#      into sandboxes — inherited, never configured here, so its invisibility is
#      right, and the computed-key arm added later keeps it invisible by reading
#      one line at a time: its key names sit lines away from its
#      `process.env[key]` at `src/mastra/config/sandbox.ts:56`. The other
#      class was ARRAY LITERALS. `src/mastra/config/sandbox.ts:288-289` reads
#      MASTRA_PLATFORM_ACCESS_TOKEN, MASTRA_PLATFORM_SECRET_KEY,
#      MASTRA_ENVIRONMENT_ID and MASTRA_PROJECT_ID through `process.env[key]`
#      over them, and those four are configuration; a fifth key added to such a
#      literal used to be invisible here. A second arm now covers that FOR
#      SINGLE-LINE LITERALS: it extracts quoted SCREAMING_SNAKE tokens from the
#      part of a line BEFORE its computed `process.env[` index and checks each
#      against `.env.schema`, guarded by a self-probe rather than a tree
#      sentinel.
#      THE RESIDUAL IS A LITERAL WRAPPED ACROSS LINES, and it is a different
#      thing from the host-variable case above. The arm ties tokens to the index
#      by LINE NUMBER, so a literal a formatter has broken over several lines,
#      with its `.some(key => process.env[key])` on yet another, is still
#      invisible — measured, guards 26 and 41 both exit 0 on one. The
#      `LOCAL_SANDBOX_ENV_KEYS` sweep is invisible BY DESIGN because those keys
#      are inherited rather than configured; a wrapped literal is invisible
#      because this is a grep and not a parser. Do not read the first as cover
#      for the second. The guard-26 bullet at the end of this comment block has
#      the shape and the reasoning.
#   3. .env.schema and .env.example carry the same keys in the same ORDER.
#      .env.example is the file an operator copies to .env, and nothing else
#      compares the two — `varlock load` never opens the example. A key declared
#      on one side only, or moved on one side only, is how the copy an operator
#      actually edits stops being the list. Both extractions require the
#      assignment to run to end of line with no space after the `=`, so a prose
#      line like `# NODE_ENV=development wins over that default` is not read as a
#      phantom key — which it was, and which reported as a bogus ORDER failure.
#      Duplicate names are checked on each side BEFORE the order comparison, for
#      the same reason: a repeated key otherwise surfaced as "different ORDER"
#      and misdirected the fix.
#   4. Every key the deployment SETS is declared: both plists'
#      `EnvironmentVariables`, every `export KEY=` in ops/*.sh (the wrapper is a
#      deployment-set site exactly as the plists are — it exports PATH and
#      DOCKER_HOST), and every `${KEY}` docker-compose.yml interpolates. Each
#      plist is checked individually: a `plutil` error fails as itself, and a
#      plist contributing no key fails naming that plist, because the whole-set
#      sentinel alone let one plist lose its dict while the other kept the set
#      non-empty. The carve-out list is DERIVED, not hardcoded — it is the
#      `Not .env keys:` line of ops/README.md, where PATH is recorded as a
#      process-environment setting the plists and the wrapper make rather than
#      configuration. So exempting a key means writing down why, in the file that
#      owns the deployment, instead of editing a pattern here. Only BACKTICKED
#      names on that line are read: extracting every ALL-CAPS word let a name
#      written in the prose after the list silently exempt a real plist key,
#      which is why ops/README.md states the backticked form as the rule. An
#      empty or missing carve-out line fails as itself rather than failing on
#      PATH. ops/README.md says beside that line that the gate reads it.
#   5. SECRETS NEVER ENTER THE REPO, at two surfaces. No member of the gitignored
#      `.env.*` family is in the index — not just `.env`: .gitignore negates only
#      .env.example and .env.schema, and README.md records that `npm run dev`
#      also loads .env.local and .env.development, so `git add -f .env.local` was
#      unchecked. The assertion is a listing filter rather than a fixed name
#      list, so a family member nobody thought of is caught too. The filter is
#      anchored at any path segment, not only at root: `git add -f apps/.env`
#      with a password in it was unchecked while `.env` at root was not, and
#      .gitignore ignores the family at every depth. Every other guard here that
#      reads the tree through `git` depends on this staying true.
#      And no tracked non-vendored file matches a live credential shape:
#      xox[baprs]-, xapp-, gh[pours]_, github_pat_, sk-, lin_api_, AKIA, and a PEM
#      private-key header followed by up to four non-base64 characters and then
#      16 base64 ones. That tolerance is what catches the `\n`-escaped single-line
#      form apps/github/README.md tells the operator to produce, which a
#      base64-immediately-after-header pattern missed; the 16-character run is
#      what keeps the `...`-truncated placeholders in .env.schema and
#      apps/github/README.md from matching. grep is line-based, so the header
#      shape cannot reach the body of a CONVENTIONAL multi-line PEM — the format
#      a downloaded GitHub App key actually has, and which passed. A whole-line
#      base64 run of 60+ characters covers that body, and there is no such line
#      in the tree today. The two secrets README.md tells the operator to GENERATE
#      (BETTER_AUTH_SECRET, FACTORY_CREDENTIAL_ENCRYPTION_KEY) have no prefix to
#      match on at all, so they are matched by name against a long base64 value —
#      the realistic case being a .env line pasted into a document.
#      node_modules/, .agents/ and skills-lock.json are excluded as vendored.
#   6. THE RESTATEMENT LINE, which was the one acceptance criterion with no gate
#      and regressed silently in all three directions. No owned-keys README names
#      @required, @public, @sensitive or @type=, nor restates a declared pattern
#      in words instead of sigils — "fails the pattern" and "varlock load" are on
#      the list because the sandbox/README.md sentence this story REMOVED used
#      exactly that wording and carried no sigil, so it could be pasted straight
#      back green. AD-6's line is "a README may say what goes wrong and what the
#      operator sees"; `apps/github/README.md`'s "passes validation" stays on the
#      allowed side and is deliberately not on the list.
#      Neither .env.schema NOR .env.example carries a credential-generation
#      command (openssl, ssh-keygen, /dev/urandom, /dev/random, uuidgen, pwgen,
#      gpg --gen) or provider-console navigation. The example is read because it
#      is the copy an operator edits and it carries the same comments: the
#      openssl how-to and the Slack console paths were removed from BOTH files by
#      this story, and only one side was checked. Navigation is told from the
#      legitimate state-signer chain by what sits beside the arrow: `A → B`
#      between ALL-CAPS key names passes, an arrow with a lower-cased console
#      section on either side ("Basic Information → App Credentials") fails. A
#      plain `>` between two words is navigation too — "Basic Information > App
#      Credentials" passed the arrow scan, and so did the comma-separated prose
#      rewrite of the GitHub path this story deleted; there is no such `>` in
#      either file today. This guard extracts nothing, so its sentinel is that
#      all eight files it opens are non-empty rather than merely present. All
#      checks report file, line and the offending text, and all are reported in
#      one run rather than stopping at the first.
# All six verified both ways in this worktree: they pass on the settled tree, and
# fail naming the offender when a `PORT` row is added to sandbox/README.md (named
