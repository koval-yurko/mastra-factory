  '''sh -c 'd=sandbox/factory-sandbox.Dockerfile; test -s "$d" || { echo "missing or empty $d — NFR19 makes this the sandbox image, and this guard asserts what it may not contain"; exit 1; }; test -f "$d" || { echo "$d is not a regular file — a grep over a directory or a device reports no matches, and an absence-of-match guard would then pass vacuously on a subject it never read"; exit 1; }; m=$(grep -nEi "^[[:space:]]*(ONBUILD[[:space:]]+)?(COPY|ADD)[[:space:]]" "$d"); test -z "$m" || { echo "$d bakes content into the image: $m — the sandbox carries a generic toolchain only; the repository is CLONED into /workspace at run time, never COPYed or ADDed at build time, and a baked copy is stale the moment the tree moves. ONBUILD COPY/ADD counts: it defers the same bake to every derived build rather than avoiding it"; exit 1; }' ''',
  '''sh -c 'd=sandbox/factory-sandbox.Dockerfile; test -s "$d" || { echo "missing or empty $d — this guard asserts its one WORKDIR, reconciles the three other tracked copies of that path against it, and asserts its one explicitly tagged FROM"; exit 1; }; test -f "$d" || { echo "$d is not a regular file — a grep over a directory or a device reports no matches, and the WORKDIR and FROM counts would then be read as zero on a subject this guard never opened"; exit 1; }; wl=$(grep -nEi "^[[:space:]]*WORKDIR[[:space:]]" "$d"); wn=$(printf "%s\n" "$wl" | grep -c .); test "$wn" = "1" || { echo "$d must carry exactly one WORKDIR instruction, found $wn: $wl — sandbox/README.md ties MASTRACODE_SANDBOX_WORKDIR to it by sight, and zero or two of them make that binding unreadable"; exit 1; }; wd=$(printf "%s\n" "$wl" | sed -E "s/^[0-9]+:[[:space:]]*[Ww][Oo][Rr][Kk][Dd][Ii][Rr][[:space:]]+//" | tr -d "\042\047\015" | tr "\011" " "); wd=${wd%% *}; test "$wd" = "/workspace" || { echo "$d WORKDIR is $wd, not /workspace — that is the clone path the Factory mounts and the one sandbox/README.md documents"; exit 1; }; s=.env.schema; test -s "$s" || { echo "missing or empty $s — it declares MASTRACODE_SANDBOX_WORKDIR, one of the four tracked copies of this path, and AD-6 makes it the only list of environment keys"; exit 1; }; test -f "$s" || { echo "$s is not a regular file — a grep over a directory or a device reports no matches, and its declaration count would then be read as zero on a subject this guard never opened"; exit 1; }; el=$(grep -nE "^MASTRACODE_SANDBOX_WORKDIR=" "$s"); en=$(printf "%s\n" "$el" | grep -c .); test "$en" = "1" || { echo "$s must declare MASTRACODE_SANDBOX_WORKDIR exactly once at column 0, found $en: $el — with zero or two of them there is no default for this guard to reconcile against the $d WORKDIR of $wd"; exit 1; }; ev=$(printf "%s\n" "$el" | sed -E "s/^[0-9]+:MASTRACODE_SANDBOX_WORKDIR=//" | tr -d "\042\047\015" | tr "\011" " "); ev=${ev%% *}; ev=${ev%;}; t