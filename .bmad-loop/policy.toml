#   3. THE BUILD ITSELF. FR36/AC2 make `npm run build` succeeding an acceptance
#      criterion, and it was the ONE criterion in this epic with no recurring
#      check: every story so far confirmed it by hand and wrote the result in its
#      verification notes, which makes it an observation rather than a gate. It
#      is the only command here that bundles the entry and the whole `config/`
#      graph behind it through `@mastra/deployer` — resolving every relative
#      import, running the deployer's own passes over the entry source
#      (`checkConfigExport` among them) and installing the output's dependencies.
#      `tsc` and `vitest` both read the tree through their own resolvers and
#      neither produces the artifact that gets deployed, so a change that leaves
#      both green and the bundle unbuildable is exactly the failure this story's
#      shape invites: the entry now reaches every concern through ONE relative
#      import, and the deployer resolves that import itself.
#      It is appended as a plain command, like `npm test`, and it leaves the tree
#      clean: `git status --porcelain` is byte-identical before and after a
#      successful build, because `.mastra/`, where the bundle and its own
#      `npm install` land, and `src/mastra/public/` are both gitignored —
#      measured, not assumed. (That is a fact about the whole tree, not about the
#      two `git status --porcelain` entries above: those are path-scoped to
#      `.agents/skills` and `skills-lock.json` and both run BEFORE this one, so
#      they could neither see nor be reached by anything the build writes.)
#      What it costs, so nobody has to rediscover it: the build runs a SECOND
#      dependency install, its own, inside `.mastra/output` — roughly 900 packages
#      and about a gigabyte on disk per worktree, which `[scm] isolation =
#      "worktree"` makes one per story — and it is the only entry after `npm ci`
#      that needs the registry. `[verify]` has no per-command timeout; the
#      `session_timeout_min` at the top of this file is the only ceiling.
# All three verified both ways in this worktree. They pass on the settled tree,
# and they fail naming the offender: when `const x = 1;` is added at the entry's
# top level, when `process.env.MASTRACODE_PUBLIC_URL` is added inside the
# `new Mastra({ … })` block, when the same read is written as
# `process["env"].MASTRACODE_PUBLIC_URL` there, when a `new PinoLogger()` or a
# `new PinoLogger<string>()` is added there, when a second statement is appended
# to the entry's import line, when
# `new MastraFactory(` is pasted back into the entry, when the `factory` import
# is turned into a bare side-effect or star import, and when
# `await factory.finalize();` is deleted (guard 40, printing the line, the match
# or the count in each case); and when a second
# `process.env.MASTRACODE_ALLOWED_ORIGINS` is added under `src/`, when a second
# read of `LINEAR_CLIENT_SECRET` — a key no guard named before this one — is
# added, when either of those is spelled `process["env"].KEY` instead, when the
# one `MASTRACODE_PUBLIC_URL` read is moved out of
# `src/mastra/config/`, and when it is moved to another module INSIDE that
# directory, which satisfies the count and still takes the key away from
# `config/public-url.ts` (guard 41, naming the key, the count, the module it
# expects and every read site); and, for guard 42, when the deployer cannot
# resolve the entry's one relative import — though pick the example carefully:
# `tsc` (entry 2) reports a MISSPELLED import first, as
# `TS2307: Cannot find module './config/factorry'`, so the gate never reaches 42
# on that tree. What only 42 sees is a graph `tsc` accepts and the bundler does
# not — an unexternalizable dependency, a `node:` builtin the bundle rejects, a
# deployer pass that reads the entry's SOURCE rather than its types.
# Guard 42 is NOT a stricter `checkConfigExport` than guard 36: a tree with
# `export { built as mastra }` instead of a construction at the export site was
# tried, and the build accepted it while guard 36 failed. The two are
# complementary, and guard 36 is the one that pins the export SHAPE.
# Guards 35 and 37 were re-verified after the re-point: both fail naming
# `config/factory.ts` when the `new MastraFactory({` there is renamed, both still
# fail on a CONCERN constructor pasted back into the entry (`new
# RedisStreamsPubSub(` there fails 35), and guard 37 still fails when
# `githubAppSlug` is hoisted out of `platform: { … }`. What they no longer see,
# now that they read the call out of `config/factory.ts`, is a whole
# `new MastraFactory({ … })` pasted back into the entry: measured, both exit 0 on
# that tree and guard 40 is the only one that fails it. That is the right split —
# a second factory in the entry is a statement FR34 does not admit, which is
# guard 40's subject, while 35 and 37 exist to prove each concern reaches a slot
# of the ONE call, wherever it lives — but it means a split call is caught once,
# not twice.
# Verified NOT to fail on the legitimate cases: the entry's own docstring, which
# names `MastraFactory` and `prepare()` in prose on lines that are wholly
# comments; the indented body of the `new Mastra({ … })` literal, which is
# continuation rather than top-level statements; the legal
# `export const mastra: Mastra =` with the constructor on the next line; a legal
# trailing line comment on any of the three statements, such as
# `await factory.finalize(); // boot`, which an earlier draft of guard 40
# rejected while claiming the entry had grown a statement;
# `MASTRA_DB_PATH` read once in `index.test.ts` rather than under `config/`; the
# twenty-nine declared keys no first-party file reads at all; and every
# `vi.stubEnv` call and key-name array in the `config/*.test.ts` suites,
# including the new `config/factory.test.ts`, which name declared keys as quoted
# strings without reading them.
commands = [
  "npm ci --no-audit --no-fund",
  "npm run check",
  "npx varlock load --format json",
  '''sh -c 'npx varlock load --format json-full | node -e "let s=\"\";process.stdin.on(\"data\",d=>s+=d).on(\"end\",()=>{const c=JSON.parse(s).config||{};for(const k of [\"MASTRA_HOST\",\"PORT\",\"DOCKER_HOST\"]){if(!c[k]||c[k].isSensitive!==false){console.error(\"env key not marked @public in .env.schema: \"+k);process.exit(1)}}})"' ''',
  '''sh -c 'git ls-files "*.ts" "*.js" "*.mjs" "*.cjs" | grep -v "^src/" && exit 1 || exit 0' ''',
  '''sh -c 'git status --porcelain -- .agents/skills | grep . && exit 1 || exit 0' ''',
  "npm test",
  '''sh -c 'plutil -lint ops/launchagents/*.plist' ''',
  '''sh -c 'for f in ops/*.sh; do zsh -n "$f" || exit 1; done' ''',
  '''sh -c 'git ls-files -s ops/factory-start.sh ops/install.sh | grep -c "^100755 " | grep -qx 2 || { echo "ops/*.sh must be mode 100755 in the index"; exit 1; }' ''',
  '''sh -c 'r=$(sed -n "s/^readonly EXPECTED_ROOT=//p" ops/install.sh | tr -d "\""); p=ops/launchagents/ai.mastra.factory.plist; test -n "$r" && test "$(plutil -extract WorkingDirectory raw $p)" = "$r" && test "$(plutil -extract ProgramArguments.2 raw $p)" = "$r/ops/factory-start.sh" && test "$(sed -n "s/^readonly REPO_ROOT=//p" ops/factory-start.sh | tr -d "\"")" = "$r" || { echo "baked repo root disagrees across ops/install.sh, $p and ops/factory-start.sh"; exit 1; }' ''',
  '''sh -c 'for p in ops/launchagents/*.plist; do b=$(basename "$p" .plist); l=$(plutil -extract Label raw "$p") || exit 1; test "$l" = "$b" || { echo "$p: Label $l does not match filename stem $b — launchd registers the job under its Label"; exit 1; }; if plutil -extract UserName raw "$p" >/dev/null 2>&1; then echo "$p: carries UserName — these are agents, not daemons"; exit 1; fi; if grep -q "[$]HOME" "$p"; then echo "$p: contains a literal \$HOME, which launchd never expands"; exit 1; fi; done' ''',
  '''sh -c 'c=ops/newsyslog/ai.mastra.factory.conf; test -f "$c" || { echo "missing $c"; exit 1; }; d=$(grep -cvE "^[[:space:]]*(#.*)?$" "$c"); n=$(grep -cE "^[^[:space:]]+[[:space:]]+koval:staff[[:space:]]+644[[:space:]]+7[[:space:]]+10240[[:space:]]+\*[[:space:]]+NJ$" "$c"); test "$d" = "4" && test "$n" = "4" || { echo "$c: expected 4 rotation rows on koval:staff 644 7 10240 * NJ — found $d data rows, $n well-formed"; exit 1; }' ''',
  '''sh -c 'h=$(sed -n "s/^readonly EXPECTED_HOME=//p" ops/install.sh | tr -d "\""); test -n "$h" || { echo "no EXPECTED_HOME in ops/install.sh"; exit 1; }; d="$h/Library/Logs/mastra-factory"; pl=$(for p in ops/launchagents/*.plist; do plutil -extract StandardOutPath raw "$p" || exit 1; plutil -extract StandardErrorPath raw "$p" || exit 1; done | sort); cf=$(grep -vE "^[[:space:]]*(#.*)?$" ops/newsyslog/ai.mastra.factory.conf | awk "{print \$1}" | sort); test "$pl" = "$cf" || { echo "rotation conf log paths differ from the plists StandardOutPath/StandardErrorPath"; exit 1; }; echo "$pl" | grep -qvE "^$d/[^/]+$" && { echo "a log path is not directly under $d, which ops/install.sh is what creates"; exit 1; }; exit 0' ''',
  '''sh -c 'c=ops/newsyslog/ai.mastra.factory.conf; d=ops/README.md; for f in "$c" "$d"; do test -f "$f" || { echo "missing $f"; exit 1; }; done; e="/[A-Za-z0-9_./-]*mastra-factory/[A-Za-z0-9_.-]+\.log"; cf=$(grep -vE "^[[:space:]]*(#.*)?$" "$c" | awk "{print \$1}" | grep -oE "$e" | sort -u); rd=$(sed -n "/^### 4 — rotation is in force$/,/^### 5 /p" "$d" | grep -oE "$e" | sort -u); test -n "$rd" || { echo "$d: supervision checkpoint 4 names no $e path, so it asserts nothing about $c"; exit 1; }; test "$cf" = "$rd" || { echo "$d supervision checkpoint 4 and $c disagree on the rotated log paths: conf has [$(echo $cf)], checkpoint 4 has [$(echo $rd)]"; exit 1; }' ''',
  '''sh -c 'd=ops/README.md; test -f "$d" || { echo "missing $d"; exit 1; }; pl=$(for p in ops/launchagents/*.plist; do plutil -extract Label raw "$p" || exit 1; done | sort -u); rd=$(grep -oE "gui/[$]\(id -u\)/[A-Za-z0-9_.-]+" "$d" | sed "s|.*/||; s|[.-]*$||" | sort -u); fn=$(grep -oE "LaunchAgents/[A-Za-z0-9_.-]+[.]plist" "$d" | sed "s|.*/||; s|[.]plist$||" | sort -u); test -n "$rd" || { echo "$d addresses no gui/\$(id -u)/<job> name, so it asserts nothing about the plist Labels"; exit 1; }; test "$pl" = "$rd" || { echo "$d and ops/launchagents/*.plist disagree on the launchd job names: plists declare [$(echo $pl)], $d addresses [$(echo $rd)]"; exit 1; }; test -n "$fn" || { echo "$d names no ~/Library/LaunchAgents/<name>.plist, so it asserts nothing about the plist filenames"; exit 1; }; test "$pl" = "$fn" || { echo "$d and ops/launchagents/*.plist disagree on the plist filenames: plists are [$(echo $pl)].plist, $d bootstraps [$(echo $fn)].plist"; exit 1; }' ''',
  '''sh -c 'd=ops/README.md; s=ops/factory-start.sh; for f in "$d" "$s"; do test -f "$f" || { echo "missing $f"; exit 1; }; done; q=$(printf "\47"); l=$(grep -oE "grep -F $q\[factory\][^$q]*" "$d" | sed "s/^.*-F $q//" | sort -u); test -n "$l" || { echo "$d greps for no [factory] line, so it asserts nothing about $s"; exit 1; }; m=$(echo "$l" | while IFS= read -r x; do grep -Fq -e "$x" "$s" || echo "$x"; done); test -z "$m" || { echo "$d greps out.log for [factory] text $s does not print: $m"; exit 1; }' ''',
  '''sh -c 'd=ops/README.md; c=ops/newsyslog/ai.mastra.factory.conf; for f in "$d" "$c"; do test -f "$f" || { echo "missing $f"; exit 1; }; done; a=$(grep -oE "newsyslog -F[^|;]*" "$d" | awk "{print \$NF}" | sort -u); test -n "$a" || { echo "$d forces no newsyslog -F run, so it asserts nothing about $c"; exit 1; }; cf=$(grep -vE "^[[:space:]]*(#.*)?$" "$c" | awk "{print \$1}" | sort -u); m=$(echo "$a" | while IFS= read -r x; do echo "$cf" | grep -qxF -e "$x" || echo "$x"; done); test -z "$m" || { echo "$d forces newsyslog -F on a path that is no row of $c: $m"; exit 1; }' ''',
  '''sh -c 'for p in sandbox/factory-sandbox.Dockerfile sandbox/README.md ops/README.md ops/launchagents/ai.mastra.colima.plist ops/launchagents/ai.mastra.factory.plist ops/factory-start.sh ops/newsyslog/ai.mastra.factory.conf ops/install.sh apps/github/README.md apps/linear/README.md apps/slack/README.md apps/slack/manifest.yaml; do m=$(git ls-files -s -- "$p" | cut -d" " -f1); case "$m" in 100644|100755) ;; "") echo "seeded operational artifact missing or empty: $p — not tracked; the structural seed in ARCHITECTURE-SPINE.md names one real file at this path (AD-5)"; exit 1;; *) echo "seeded operational artifact missing or empty: $p — index mode $m is not a regular file (a symlink or gitlink, which a fresh worktree checks out as a link, not the artifact); the structural seed in ARCHITECTURE-SPINE.md names one real file at this path (AD-5)"; exit 1;; esac; s=$(git cat-file -s ":$p" 2>/dev/null); test -n "$s" && test "$s" -gt 0 || { echo "seeded operational artifact missing or empty: $p — its staged blob is 0 bytes; the structural seed in ARCHITECTURE-SPINE.md names one real file at this path (AD-5)"; exit 1; }; done' ''',
  '''sh -c 'b=$(printf "\140"); sp=$(ls _bmad-output/planning-artifacts/architecture/*/ARCHITECTURE-SPINE.md 2>/dev/null); c=$(printf "%s" "$sp" | grep -c "ARCHITECTURE-SPINE.md"); test "$c" = "1" || { echo "expected exactly one _bmad-output/planning-artifacts/architecture/*/ARCHITECTURE-SPINE.md to derive the AD-3 root sets from, found $c — the root closed set is normative in the spine, not here"; exit 1; }; s3=$(sed -n "/^### AD-3/,/^### AD-4/p" "$sp"); printf "%s\n" "$s3" | tail -1 | grep -q "^### AD-4" || { echo "the AD-3 section of $sp does not end at a ### AD-4 heading, so the extraction range of this guard ran past it and would read rows from later sections — fix the spine headings"; exit 1; }; db=$(sed -n "/[*][*]Root directories — closed set/,/[*][*]Root allowlist — closed set/p" "$sp"); printf "%s\n" "$db" | tail -1 | grep -q "[*][*]Root allowlist — closed set" || { echo "the AD-3 root directory closed-set bullet of $sp is not followed by its root allowlist bullet, so the extraction range of this guard ran to end of file and would silently WIDEN the closed set with every backticked path elsewhere in the spine — fix the spine bullets"; exit 1; }; af=$(printf "%s\n" "$s3" | grep -oE "^[[:space:]]*[|] $b[^$b]+$b [|]" | sed "s/^[[:space:]]*[|] $b//; s/$b [|]\$//"); ad=$(printf "%s\n" "$db" | grep -oE "$b[A-Za-z_.][A-Za-z0-9_.-]*/$b" | tr -d "$b" | sed "s|/\$||" | sort -u); printf "%s\n" "$af" | grep -qxF "package.json" || { echo "could not extract the AD-3 root allowlist table from $sp (no package.json row) — this guard derives root from the spine, so fix the AD-3 table"; exit 1; }; printf "%s\n" "$ad" | grep -qxF "src" || { echo "could not extract the AD-3 root directory closed set from $sp (no src/ entry) — this guard derives root from the spine, so fix the AD-3 closed-set bullet"; exit 1; }; tf=$(git -c core.quotePath=false ls-files | grep -v "/"); wt=$(git -c core.quotePath=false ls-files; git -c core.quotePath=false ls-files -o --exclude-standard); rf=$(printf "%s\n" "$wt" | grep -v "/" | sort -u); rd=$(printf "%s\n" "$wt" | grep "/" | cut -d/ -f1 | sort -u); o=$(printf "%s\n" "$rf" | while IFS= read -r x; do test -n "$x" || continue; printf "%s\n" "$af" | grep -qxF -e "$x" || echo "$x"; done); test -z "$o" || { echo "root file not in the AD-3 root allowlist: $o — move it under its subject directory, or amend AD-3 naming the tool that fixes its location. Tracked and untracked-but-not-ignored files both count, because the orchestrator stages the working tree (git add -A) when it commits the story"; exit 1; }; o=$(printf "%s\n" "$rd" | while IFS= read -r x; do test -n "$x" || continue; printf "%s\n" "$ad" | grep -qxF -e "$x" || echo "$x"; done); test -z "$o" || { echo "root directory not in the AD-3 closed set: $o — adding a root directory is a spine change, not a local call. Tracked and untracked-but-not-ignored directories both count, because the orchestrator stages the working tree (git add -A) when it commits the story"; exit 1; }; o=$(printf "%s\n" "$af" | while IFS= read -r x; do test -n "$x" || continue; git check-ignore -q -- "$x" && continue; printf "%s\n" "$tf" | grep -qxF -e "$x" || echo "$x"; done); test -z "$o" || { echo "AD-3 root allowlist entry is not tracked at root: $o — AD-3 and the Structural Seed say root is exactly that closed set, so removing a root file is a spine change, not a local call"; exit 1; }' ''',
  '''sh -c 'node -e "const fs=require(\"fs\");let i;try{i=JSON.stringify(JSON.parse(fs.readFileSync(\"tsconfig.json\",\"utf8\").replace(/^[ \t]*\/\/.*\$/gm,\"\")).include)}catch(e){console.error(\"tsconfig.json unreadable or not valid JSON: \"+e.message);process.exit(1)}const w=JSON.stringify([\"src/**/*\"]);if(i!==w){console.error(\"tsconfig.json include must be exactly \"+w+\" (AD-4) — widening it is a spine change, and tsc cannot report its own blind spot; found \"+i);process.exit(1)}"' ''',
  '''sh -c 'e=1ba191439fb2f355443273b6eb18ab0ce71227a8067dd434617c759aa125dff8; l=$(git ls-files -s .agents/skills skills-lock.json) || { echo "could not read the .agents/skills + skills-lock.json index rows (git failed) — AD-13 is unverified, not satisfied"; exit 1; }; test -n "$l" || { echo "git lists no index rows for .agents/skills or skills-lock.json — both are vendored and tracked (AD-13), so an empty listing is a broken checkout, not a satisfied rule"; exit 1; }; a=$(printf "%s\n" "$l" | shasum -a 256 | cut -d" " -f1); test -n "$a" || { echo "could not compute the .agents/skills + skills-lock.json index digest (shasum failed) — AD-13 is unverified, not satisfied"; exit 1; }; test "$a" = "$e" || { echo ".agents/skills and skills-lock.json are vendored and hash-locked together (AD-13), but their combined git index digest changed: found $a, expected $e — neither is ever hand-edited; regenerate through the Mastra CLI and update skills-lock.json and this expected digest in the same change"; exit 1; }' ''',
  '''sh -c 'for p in sandbox/factory-sandbox.Dockerfile sandbox/README.md ops/README.md ops/launchagents/ai.mastra.colima.plist ops/launchagents/ai.mastra.factory.plist ops/factory-start.sh ops/newsyslog/ai.mastra.factory.conf ops/install.sh apps/github/README.md apps/linear/README.md apps/slack/README.md apps/slack/manifest.yaml; do if test -L "$p"; then echo "seeded operational artifact is a symlink in the WORKING TREE: $p — the structural seed in ARCHITECTURE-SPINE.md names one real file at this path (AD-5); replace the link with the file"; exit 1; fi; test -f "$p" || { echo "seeded operational artifact missing from the WORKING TREE: $p — the structural seed in ARCHITECTURE-SPINE.md names one real file at this path (AD-5); restore it with git checkout -- $p"; exit 1; }; test -s "$p" || { echo "seeded operational artifact is empty in the WORKING TREE: $p — the structural seed in ARCHITECTURE-SPINE.md names one real file at this path (AD-5); restore its content with git checkout -- $p"; exit 1; }; done' ''',
  '''sh -c 'git status --porcelain -- skills-lock.json | grep . && { echo "skills-lock.json is modified in the working tree or the index — it is vendored and never hand-edited (AD-13); revert it with git checkout -- skills-lock.json, or regenerate it through the Mastra CLI and move the pinned digest in the guard above in the same change"; exit 1; } || exit 0' ''',
